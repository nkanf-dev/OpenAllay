import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.api.artifacts.component.ProjectComponentIdentifier
import java.util.zip.ZipFile

plugins {
    id 'java-library'
    id 'java-test-fixtures'
}

// This value is independent of minecraftTarget and the native java_version.
// One Java8 production ABI serves all accepted native families. Tests and test fixtures use the installed Java21 compiler.
def engineJavaVersion = 8
base { archivesName = 'openallay-engine-core' }
java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
    withJavadocJar()
}
tasks.withType(JavaCompile).configureEach {
    options.release = name in ['compileTestJava', 'compileTestFixturesJava'] ? 21 : engineJavaVersion
    options.encoding = 'UTF-8'
}
tasks.withType(Jar).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    from(rootProject.file('LICENSE')) { rename { 'LICENSE_OpenAllay' } }
}

dependencies {
    // Host-supplied public SDK stays separately packaged, never shaded into the engine.
    api(project(':extension-api'))
    compileOnlyApi(project(':runtime-json'))
    api('com.google.code.gson:gson:2.8.0')
    api(project(':runtime-rhino'))
    compileOnly(project(path: ':runtime-maven', configuration: 'privateRuntime'))
    implementation(project(':runtime-commonmark'))
    implementation("com.knuddels:jtokkit:${jtokkit_version}")
    runtimeOnly("org.xerial:sqlite-jdbc:${sqlite_jdbc_version}")
    testImplementation('org.junit.jupiter:junit-jupiter:5.11.4')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher:1.11.4')
}

// Reuse the independently compiled helper in the one game-mod engine output. The
// compile-only project edge avoids an extra runtime JAR or classloader identity.
evaluationDependsOn(':runtime-json')
def jsonSupport = project(':runtime-json')
sourceSets.main.output.dir([builtBy: jsonSupport.tasks.named('classes')],
        jsonSupport.sourceSets.main.output.classesDirs.singleFile)

// Merge the one privately relocated Maven closure into the same engine output.
// It is not a second library layer or a dependency of the public Extension SDK.
evaluationDependsOn(':runtime-maven')
def privateMavenJar = project(':runtime-maven').tasks.named('shadowJar', Jar)
def privateMavenOutput = layout.buildDirectory.dir('generated/private-maven')
def mergePrivateMaven = tasks.register('mergePrivateMaven', Sync) {
    dependsOn(privateMavenJar)
    from({ zipTree(privateMavenJar.get().archiveFile.get().asFile) }) {
        exclude 'META-INF/MANIFEST.MF'
    }
    into(privateMavenOutput)
}
sourceSets.main.output.dir([builtBy: mergePrivateMaven], privateMavenOutput)
// Keep the producer dependency on the directory for every classpath consumer,
// including test fixtures and Loom's normal development mod classpath.
sourceSets.main.output.classesDirs.from(files(privateMavenOutput).builtBy(mergePrivateMaven))
tasks.named('classes') { dependsOn(mergePrivateMaven) }

// Enforce actual resolved production classpaths, not names appearing in source comments.
def productionCoordinates = [
    'com.google.code.gson:gson', 'com.google.errorprone:error_prone_annotations',
    'dev.latvian.mods:rhino', 'com.google.guava:guava', 'com.google.guava:failureaccess',
    'com.google.guava:listenablefuture', 'com.google.code.findbugs:jsr305',
    'org.checkerframework:checker-qual', 'com.google.j2objc:j2objc-annotations',
    'com.knuddels:jtokkit', 'org.xerial:sqlite-jdbc'
] as Set
def nativeClassPrefixes = [
    'net/minecraft/', 'com/mojang/', 'net/fabricmc/', 'net/neoforged/',
    'org/lwjgl/', 'org/spongepowered/', 'com/llamalad7/',
    'mezz/jei/', 'me/shedaniel/', 'dev/architectury/'
]
def verifyProductionDependencies = tasks.register('verifyProductionDependencies') {
    group = 'verification'
    description = 'Reject native/loader dependencies and classes from the engine production classpaths.'
    doLast {
        ['compileClasspath', 'runtimeClasspath'].each { name ->
            def configuration = configurations.getByName(name)
            configuration.incoming.resolutionResult.allComponents.each { component ->
                def id = component.id
                if (id instanceof ProjectComponentIdentifier) {
                    if (!(id.projectPath in [project.path, ':extension-api', ':runtime-json', ':runtime-maven', ':runtime-rhino', ':runtime-commonmark'])) {
                        throw new GradleException("Engine cannot depend on native project ${id.projectPath}")
                    }
                } else if (id instanceof ModuleComponentIdentifier) {
                    def coordinate = "${id.group}:${id.module}".toString()
                    if (!productionCoordinates.contains(coordinate)) {
                        throw new GradleException("Unapproved engine production dependency ${id.displayName}")
                    }
                } else {
                    throw new GradleException("Unidentified engine production component ${id.displayName}")
                }
            }
            configuration.files.each { artifact ->
                def checkClass = { String entry ->
                    def classPath = entry.replaceFirst('^META-INF/versions/[0-9]+/', '')
                    if (classPath.endsWith('.class') && nativeClassPrefixes.any { classPath.startsWith(it) }) {
                        throw new GradleException("Native class ${entry} in engine ${name}: ${artifact}")
                    }
                }
                if (artifact.isDirectory()) {
                    // Standard java-library project compile variants expose classes directories.
                    rootProject.fileTree(artifact) { include '**/*.class' }.each { file ->
                        checkClass(artifact.toPath().relativize(file.toPath()).toString().replace('\\', '/'))
                    }
                } else if (artifact.isFile() && artifact.name.endsWith('.jar')) {
                    new ZipFile(artifact).withCloseable { jar ->
                        jar.entries().each { entry -> checkClass(entry.name) }
                    }
                } else {
                    throw new GradleException("Unidentified engine classpath artifact ${artifact}")
                }
            }
        }
    }
}
// Build dependency JARs before inspecting their contents; no engine -> native edge exists.
verifyProductionDependencies.configure {
    dependsOn(configurations.compileClasspath.buildDependencies)
    dependsOn(configurations.runtimeClasspath.buildDependencies)
}
tasks.named('compileJava') { dependsOn(verifyProductionDependencies) }
tasks.named('check') { dependsOn(verifyProductionDependencies) }

def verifySourceOwnership = tasks.register('verifySourceOwnership') {
    group = 'verification'
    description = 'Reject engine classes left in native source sets or selected target overrides.'
    inputs.files(sourceSets.main.allJava)
    outputs.upToDateWhen { false }
    doLast {
        def nativeClasses = [:]
        def nativeRoots = ['common/src/main/java', 'common/src/targets',
                           'fabric/src/main/java', 'neoforge/src/main/java', 'adapters']
        nativeRoots.each { path ->
            rootProject.fileTree(path) { include '**/*.java' }.each { source ->
                def match = source.getText('UTF-8') =~ /(?m)^\s*package\s+([\w.]+)\s*;/
                if (match.find()) {
                    def qualified = match.group(1) + '.' + source.name.replaceFirst(/\.java$/, '')
                    nativeClasses.computeIfAbsent(qualified) { [] }.add(source)
                }
            }
        }
        sourceSets.main.allJava.each { source ->
            def match = source.getText('UTF-8') =~ /(?m)^\s*package\s+([\w.]+)\s*;/
            if (!match.find()) throw new GradleException("Engine source missing package: ${source}")
            def qualified = match.group(1) + '.' + source.name.replaceFirst(/\.java$/, '')
            if (nativeClasses.containsKey(qualified)) {
                throw new GradleException("Duplicated engine class ${qualified}: ${nativeClasses[qualified]}")
            }
        }
    }
}
tasks.named('compileJava') { dependsOn(verifySourceOwnership) }
tasks.named('check') { dependsOn(verifySourceOwnership) }

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    dependsOn(verifyProductionDependencies)
    dependsOn(':runtime-maven:test')
    def voiceTlsKeys = providers.environmentVariable('OPENALLAY_VOICE_TLS_KEYS')
    if (voiceTlsKeys.isPresent()) {
        // Test-only local HTTPS trust must not replace Gradle's repository trust store.
        systemProperty('javax.net.ssl.trustStore', voiceTlsKeys.get())
        systemProperty('javax.net.ssl.trustStorePassword', 'fixture-only')
    }
}

// The standalone SQLite packaging probe belongs to the native-free engine tests.
tasks.register('printSqliteProofSupportClasspath') {
    doLast {
        println(sourceSets.test.runtimeClasspath.asPath)
    }
}

// Optional verification-only host runtime; production keeps the minimum public Gson ABI.
if (providers.gradleProperty('jsonVerificationGsonVersion').isPresent()) {
    apply from: rootProject.file('gradle/json-verification.gradle')
}

// Reuse exactly the Java8 explicit-value vectors with the actual EngineJson test owner.
def explicitValueTestVectors = objects.sourceDirectorySet('explicitValueTestVectors', 'Explicit value vectors')
explicitValueTestVectors.srcDir('src/java8Test/java')
explicitValueTestVectors.include('dev/openallay/json/ValueSchemaJava8Fixture.java')
sourceSets.test.java.source(explicitValueTestVectors)

// Run the actual ToolResult Java8 constructor vectors through the modern EngineJson owner.
def toolResultTestVectors = objects.sourceDirectorySet('toolResultTestVectors', 'ToolResult value vectors')
toolResultTestVectors.srcDir('src/toolResultJava8Test/java')
toolResultTestVectors.include('dev/openallay/json/ToolResultJava8Fixture.java')
sourceSets.test.java.source(toolResultTestVectors)

// Reuse actual Java8 schema/codec vectors on the normal modern EngineJson test owner.
def toolSchemaTestVectors = objects.sourceDirectorySet('toolSchemaTestVectors', 'Tool schema Java8 vectors')
toolSchemaTestVectors.srcDir('src/toolSchemaJava8Test/java')
toolSchemaTestVectors.include('dev/openallay/tool/ToolSchemaJava8Fixture.java')
sourceSets.test.java.source(toolSchemaTestVectors)

// Public-compiler source attribution uses the real current production classpath.
// This export never adds test runtime dependencies or an old engine JAR.
tasks.register('exportCanonicalVarCompileClasspath') {
    dependsOn(tasks.named('classes'))
    dependsOn(configurations.runtimeClasspath.buildDependencies)
    dependsOn(mergePrivateMaven)
    def destination = providers.gradleProperty('canonicalVarClasspathOutput')
    doLast {
        if (!destination.isPresent()) throw new GradleException('Set -PcanonicalVarClasspathOutput to a fresh external JSON path')
        def target = rootProject.file(destination.get())
        if (target.exists()) throw new GradleException("Refuse to overwrite attribution metadata: ${target}")
        def resolved = files(sourceSets.main.compileClasspath, privateMavenOutput,
                jsonSupport.sourceSets.main.output.classesDirs).files.collect { it.canonicalFile }
        resolved.each { artifact ->
            if (!artifact.exists()) throw new GradleException("Missing genuine compiler classpath entry: ${artifact}")
        }
        def sources = sourceSets.main.allJava.files.collect { it.canonicalPath }.sort()
        target.parentFile.mkdirs()
        target.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
                sourceRoot: file('src/main/java').canonicalPath,
                sources: sources,
                compileClasspath: resolved.collect { it.canonicalPath },
                runtimeClasspath: sourceSets.main.runtimeClasspath.files.collect { it.canonicalPath }.sort(),
                classpath: resolved.collect { it.canonicalPath }.join(File.pathSeparator),
                release: tasks.named('compileJava').get().options.release.get(),
                sourceClosure: 'all current canonical engine-core production Java sources',
                producer: ':engine-core:compileJava'
        ])) + '\n', 'UTF-8')
        println("Canonical CORE compile classpath exported: ${target}")
    }
}

// Actual closed-union admission vectors run on normal engine production owners.
def guideUnionAdmissionVectors = objects.sourceDirectorySet('guideUnionAdmissionVectors', 'Guide union admission vectors')
guideUnionAdmissionVectors.srcDir('src/guideUnionAdmissionTest/java')
sourceSets.test.java.source(guideUnionAdmissionVectors)

// Inspect actual emitted production classes and runtime artifacts, not source syntax alone.
def verifyEngineJava8Bytecode = tasks.register('verifyEngineJava8Bytecode') {
    group = 'verification'
    description = 'Require Java8 class files throughout the canonical production engine/runtime graph.'
    dependsOn(tasks.named('classes'))
    dependsOn(configurations.runtimeClasspath.buildDependencies)
    doLast {
        def checkClass = { String name, byte[] bytes, String owner, boolean compiledOwner ->
            // Java8 ignores multi-release entries; inspect the base classes it can load.
            if (name.startsWith('META-INF/versions/') || !name.endsWith('.class')) return
            if (bytes.length < 8 || bytes[0] != (byte) 0xca || bytes[1] != (byte) 0xfe
                    || bytes[2] != (byte) 0xba || bytes[3] != (byte) 0xbe) {
                throw new GradleException("Invalid production class ${owner}!${name}")
            }
            int major = ((bytes[6] & 255) << 8) | (bytes[7] & 255)
            if (major > 52 || (compiledOwner && major != 52)) {
                throw new GradleException("Production Java8 bytecode boundary: ${owner}!${name} major=${major}")
            }
        }
        def compiled = tasks.named('compileJava', JavaCompile).get().destinationDirectory.get().asFile
        rootProject.fileTree(compiled) { include '**/*.class' }.each { file ->
            def name = compiled.toPath().relativize(file.toPath()).toString().replace('\\', '/')
            checkClass(name, file.bytes, compiled.canonicalPath, true)
        }
        sourceSets.main.runtimeClasspath.files.each { artifact ->
            if (!artifact.exists()) throw new GradleException("Missing production runtime artifact ${artifact}")
            if (artifact.isDirectory()) {
                rootProject.fileTree(artifact) { include '**/*.class' }.each { file ->
                    def name = artifact.toPath().relativize(file.toPath()).toString().replace('\\', '/')
                    checkClass(name, file.bytes, artifact.canonicalPath, false)
                }
            } else if (artifact.name.endsWith('.jar')) {
                new ZipFile(artifact).withCloseable { jar ->
                    jar.entries().each { entry ->
                        if (!entry.isDirectory() && entry.name.endsWith('.class')) {
                            jar.getInputStream(entry).withCloseable { input ->
                                checkClass(entry.name, input.bytes, artifact.canonicalPath, false)
                            }
                        }
                    }
                }
            } else {
                throw new GradleException("Unknown production runtime artifact ${artifact}")
            }
        }
    }
}
tasks.named('check') { dependsOn(verifyEngineJava8Bytecode) }
