plugins { id 'java' }
def repo = file('../../../..')
def engine = new File(repo, 'engine-core')
java { toolchain.languageVersion = JavaLanguageVersion.of(21) }
def contextNames = ['IngredientAlternativeSnapshot', 'IngredientRequirementSnapshot', 'FluidRequirementSnapshot', 'RecipeOutputSnapshot',
        'RecipeEntrySnapshot', 'RecipeReference', 'RecipeSnapshot', 'SourceObservationCollector', 'EvidenceMetadata', 'SourceObservation',
        'ContextValidation', 'DataAuthority', 'DataCompleteness', 'ItemStackSnapshot', 'RecipeLayoutSnapshot', 'RecipeProcessingSnapshot']
def recipeNames = ['RecipeProviderSnapshot', 'RecipeSemanticGroup', 'RecipeCatalogDiagnostic', 'RecipeProviderDiagnostic',
        'RecipeCanonicalizer', 'RecipeProviderState', 'RecipeUnlockState']
def paths = contextNames.collect { 'dev/openallay/context/' + it + '.java' } + recipeNames.collect { 'dev/openallay/recipe/' + it + '.java' } + [
        'dev/openallay/value/ValueSchema.java', 'dev/openallay/value/ValueSchemas.java', 'dev/openallay/value/ValueType.java',
        'dev/openallay/util/Java8Collections.java', 'dev/openallay/util/Java8Strings.java', 'dev/openallay/util/Java8Hex.java']
sourceSets.main.java.setSrcDirs([new File(engine, 'src/main/java'), new File(engine, 'src/recipeContextJava8Test/java'), new File(repo, 'runtime-json/src/main/java')])
sourceSets.main.java.setIncludes(paths + ['dev/openallay/context/RecipeContextJava8Fixture.java', 'dev/openallay/json/JsonTrees.java'])
dependencies { implementation('com.google.code.gson:gson:2.8.0') }
tasks.withType(JavaCompile).configureEach { options.release = 8; options.encoding = 'UTF-8' }
tasks.register('java8RecipeContextTest', JavaExec) {
    dependsOn('classes'); mainClass = 'dev.openallay.context.RecipeContextJava8Fixture'; args('java8')
    classpath = sourceSets.main.runtimeClasspath
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(8) }
    doFirst { standardOutput = new ByteArrayOutputStream() }
    doLast {
        def report = layout.buildDirectory.file('recipe-context-java8.txt').get().asFile
        report.bytes = standardOutput.toByteArray(); logger.lifecycle(report.getText('UTF-8'))
        if (providers.gradleProperty('originalRecipeContextReport').isPresent()
                && !java.util.Arrays.equals(file(providers.gradleProperty('originalRecipeContextReport').get()).bytes, report.bytes)) {
            throw new GradleException('Original canonical recipe/context vs genuineJava8 differs')
        }
    }
}
if (providers.gradleProperty('originalRecipeContextSourceRoot').isPresent()) {
    def original = file(providers.gradleProperty('originalRecipeContextSourceRoot').get())
    tasks.register('compileOriginalRecipeContext', JavaCompile) {
        source = files(paths.collect { new File(original, 'engine-core/src/main/java/' + it) },
                new File(original, 'runtime-json/src/main/java/dev/openallay/json/JsonTrees.java'),
                new File(engine, 'src/recipeContextJava8Test/java/dev/openallay/context/RecipeContextJava8Fixture.java'))
        classpath = configurations.compileClasspath; destinationDirectory = layout.buildDirectory.dir('original-classes')
        javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(21) }
        options.release = 17; options.encoding = 'UTF-8'
    }
    tasks.register('originalRecipeContextOracle', JavaExec) {
        dependsOn('compileOriginalRecipeContext'); mainClass = 'dev.openallay.context.RecipeContextJava8Fixture'
        classpath = files(tasks.named('compileOriginalRecipeContext').flatMap { it.destinationDirectory }) + configurations.runtimeClasspath
        javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
        doFirst { standardOutput = new ByteArrayOutputStream() }
        doLast {
            def report = layout.buildDirectory.file('recipe-context-original-modern.txt').get().asFile
            report.bytes = standardOutput.toByteArray(); logger.lifecycle(report.getText('UTF-8'))
        }
    }
}
