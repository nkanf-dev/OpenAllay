plugins { id 'java' }
// Compile canonical owners only, not the full engine graph or copied/proxy sources.
def repository = file('../../../..')
java { toolchain.languageVersion = JavaLanguageVersion.of(17) }
sourceSets.main.java.setSrcDirs([new File(repository, 'engine-core/src/main/java'),
        new File(repository, 'engine-core/src/java8Test/java'),
        new File(repository, 'engine-core/src/test/java'),
        new File(repository, 'runtime-json/src/main/java')])
sourceSets.main.java.setIncludes([
        'dev/openallay/value/*.java', 'dev/openallay/util/Java8Collections.java',
        'dev/openallay/tool/query/QueryOperation.java',
        'dev/openallay/agent/tool/ToolDescription.java', 'dev/openallay/agent/tool/ToolOptional.java',
        'dev/openallay/json/EngineJson.java', 'dev/openallay/json/RecordJsonAdapter.java',
        'dev/openallay/json/ConstructorValueJsonAdapter.java',
        'dev/openallay/json/JsonReaders.java', 'dev/openallay/json/JsonTrees.java',
        'dev/openallay/json/ValueSchemaJava8Fixture.java', 'dev/openallay/json/EngineJsonJava8Fixture.java'])
dependencies { implementation('com.google.code.gson:gson:2.8.0') }
tasks.withType(JavaCompile).configureEach { options.release = 8; options.encoding = 'UTF-8' }
def host = providers.gradleProperty('jsonVerificationGsonVersion').getOrElse('2.8.0')
configurations.runtimeClasspath.resolutionStrategy.force("com.google.code.gson:gson:${host}")
tasks.register('java8EngineJsonTest', JavaExec) {
    dependsOn('classes')
    mainClass = 'dev.openallay.json.EngineJsonJava8Fixture'
    classpath = sourceSets.main.runtimeClasspath
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(8) }
    inputs.property('jsonVerificationGsonVersion', host)
    doFirst {
        def artifacts = configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts
                .findAll { it.moduleVersion.id.group == 'com.google.code.gson' && it.name == 'gson' }
        if (artifacts.size() != 1 || artifacts.first().moduleVersion.id.version != host) {
            throw new GradleException("EngineJson subset runtime must contain exactly Gson ${host}")
        }
        logger.lifecycle("Canonical EngineJson subset Gson runtime: ${artifacts.first().moduleVersion.id}")
    }
}
