configurations.runtimeClasspath.resolutionStrategy.force("com.google.code.gson:gson:${gsonVersion}")
tasks.register('java8WorldObservationTest', JavaExec) {
    dependsOn('classes'); mainClass = 'dev.openallay.world.WorldObservationJava8Fixture'; args('java8')
    classpath = sourceSets.main.runtimeClasspath
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(8) }
    doFirst { standardOutput = new ByteArrayOutputStream() }
    doLast {
        def report = layout.buildDirectory.file('observation-java8.txt').get().asFile
        report.bytes = standardOutput.toByteArray(); logger.lifecycle(report.getText('UTF-8'))
        if (!providers.gradleProperty('originalObservationReport').isPresent()) throw new GradleException('Original canonical report is required')
        if (!java.util.Arrays.equals(file(providers.gradleProperty('originalObservationReport').get()).bytes, report.bytes)) {
            throw new GradleException('Original canonical modern observation vs genuineJava8 report differs')
        }
    }
}
if (providers.gradleProperty('originalObservationSourceRoot').isPresent()) {
    def original = file(providers.gradleProperty('originalObservationSourceRoot').get())
    tasks.register('compileOriginalObservation', JavaCompile) {
        source = files(productionPaths.collect { new File(original, it) }, reporter)
        classpath = configurations.compileClasspath; destinationDirectory = layout.buildDirectory.dir('original-classes')
        javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(21) }
        options.release = 17; options.encoding = 'UTF-8'
    }
    tasks.register('originalObservationOracle', JavaExec) {
        dependsOn('compileOriginalObservation'); mainClass = 'dev.openallay.world.WorldObservationJava8Fixture'
        classpath = files(tasks.named('compileOriginalObservation').flatMap { it.destinationDirectory }) + configurations.runtimeClasspath
        javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
        doFirst { standardOutput = new ByteArrayOutputStream() }
        doLast {
            def report = layout.buildDirectory.file('observation-original-modern.txt').get().asFile
            report.bytes = standardOutput.toByteArray(); logger.lifecycle(report.getText('UTF-8'))
        }
    }
