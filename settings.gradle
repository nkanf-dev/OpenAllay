pluginManagement {
    repositories {
        maven {
            url = uri("$settingsDir/.gradle/curl-mirror")
            metadataSources {
                gradleMetadata()
                mavenPom()
                artifact()
            }
        }
        maven { url = uri('https://maven.fabricmc.net') }
        maven { url = uri('https://maven.neoforged.net/releases') }
        maven { url = uri('https://maven.minecraftforge.net') }
        gradlePluginPortal()
        mavenCentral()
        // Regional mirrors are fallbacks; public plugin repositories should
        // get the first chance to resolve their own coordinates.
        maven { url = uri('https://maven.aliyun.com/repository/gradle-plugin') }
        maven { url = uri('https://maven.aliyun.com/repository/public') }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'OpenAllay'
includeBuild('build-logic')
include('common')
include('engine-core')
include('runtime-json')
include('runtime-maven')
include('runtime-rhino')
include('runtime-commonmark')
include('extension-api')
include('adapters:minecraft')
// The root selector validates the complete map/profile before any project builds.
def target = providers.gradleProperty('minecraftTarget').getOrElse('26.2')
def targetLoaders = new groovy.json.JsonSlurper().parse(file('gradle/minecraft-target-loaders.json'))
def selected = targetLoaders[target]
if (!(selected instanceof Map) || !(selected.loaders instanceof List) || selected.loaders.empty
        || selected.loaders.any { !(it in ['fabric', 'forge', 'neoforge']) }
        || selected.loaders.toSet().size() != selected.loaders.size()) {
    throw new GradleException("Unknown or invalid Minecraft target loader selection: ${target}")
}
selected.loaders.each { include(it) }
