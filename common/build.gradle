plugins {
    id 'multiloader-common'
}

def legacyNativeGame = minecraftNativeToolchain == 'legacyForge'
pluginManager.apply(legacyNativeGame ? 'net.neoforged.moddev.legacyforge' : 'net.neoforged.moddev')

apply from: rootProject.file('gradle/minecraft-source-family.gradle')

// The selected implementation drives native test applicability, not version-name rules.
if (sourceSets.main.java.files.contains(file('src/main/java/dev/openallay/client/gui/GuideNativeGraphics.java'))) {
    sourceSets.test.java.srcDir('src/nativeTest/extractor/java')
}

configure(extensions.getByName(legacyNativeGame ? 'legacyForge' : 'neoForge')) {
    if (legacyNativeGame) mcpVersion = minecraftTargetProfile.getOrDefault('mcp_version', minecraftTargetProfile['neo_form_version'])
    else neoFormVersion = neo_form_version
    // Automatically enable AccessTransformers if the file exists
    def at = selectedMinecraftTargetResource('META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
}

def viewerApiLoader = legacyNativeGame ? 'forge' : (minecraftTarget.startsWith('1.') ? 'neoforge' : 'fabric')

dependencies {
    api(project(":engine-core"))
    api(project(":extension-api"))
    testImplementation(testFixtures(project(":engine-core")))
    // Fabric and NeoForge both bundle Fabric Mixin, so it is safe to use it in common
    // If you need to update, check what version they are using to see what is compatible
    // https://github.com/neoforged/NeoForge/blob/26.2.x/gradle.properties#L37
    // https://github.com/FabricMC/fabric-loader/blob/master/gradle.properties#L12
    compileOnly('net.fabricmc:sponge-mixin:0.17.3+mixin.0.8.7') { transitive = false }
    // Fabric and NeoForge both bundle MixinExtras, so it is safe to use it in common
    compileOnly(annotationProcessor('io.github.llamalad7:mixinextras-common:0.5.3'))
    compileOnly("mezz.jei:jei-${jeiArtifactTarget}-common-api:${jei_version}")
    compileOnly("me.shedaniel:RoughlyEnoughItems-api-${viewerApiLoader}:${rei_version}")
    compileOnly("dev.architectury:architectury-${viewerApiLoader}:${architectury_version}")
    implementation("org.commonmark:commonmark:${commonmark_version}")
    implementation("org.commonmark:commonmark-ext-gfm-tables:${commonmark_version}")
    implementation(project(':runtime-rhino'))
    implementation("com.knuddels:jtokkit:${jtokkit_version}")
    testImplementation('com.google.code.gson:gson:2.8.9')
    testImplementation('org.junit.jupiter:junit-jupiter:5.11.4')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher:1.11.4')
    testRuntimeOnly("org.xerial:sqlite-jdbc:${sqlite_jdbc_version}")
    testRuntimeOnly("mezz.jei:jei-${jeiArtifactTarget}-common-api:${jei_version}")
    testRuntimeOnly("me.shedaniel:RoughlyEnoughItems-api-${viewerApiLoader}:${rei_version}")
    testRuntimeOnly("dev.architectury:architectury-${viewerApiLoader}:${architectury_version}")
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    dependsOn(':engine-core:test')
    dependsOn(':extension-api:fixtureJar')
    systemProperty('sdkFixtureJar', project(':extension-api').tasks.named('fixtureJar', Jar)
            .flatMap { it.archiveFile }.get().asFile.absolutePath)
}

configurations.testCompileClasspath.extendsFrom(configurations.compileClasspath)
configurations.testRuntimeClasspath.extendsFrom(configurations.compileClasspath)

// Loaders consume these selected SourceDirectorySets directly. A single outgoing
// directory artifact cannot represent base files plus file-level replacements.

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'common')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'common')
            }
        }
    }
}

// Shared fixtures use Java21. This affects tests only; native production keeps its selected Java ABI.
def nativeTestJavaVersion = Math.max(21, java_version.toInteger())
['testCompileClasspath', 'testRuntimeClasspath'].each { name ->
    configurations.named(name) {
        attributes.attribute(org.gradle.api.attributes.java.TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, nativeTestJavaVersion)
    }
}
tasks.named('compileTestJava', JavaCompile) {
    javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(nativeTestJavaVersion) }
    options.release = nativeTestJavaVersion
}
tasks.withType(Test).configureEach {
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(nativeTestJavaVersion) }
}

// Native text/slot primitives are Minecraft-free. Compile only their focused tests,
// without pulling unrelated newest-game test source APIs into an older target.
sourceSets {
    nativePrimitiveTest {
        java.srcDir('src/test/java')
        java.include('dev/openallay/client/gui/GuideMultilineTextStateTest.java')
        java.include('dev/openallay/client/gui/hud/GuideToastSlotReservationsTest.java')
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations.nativePrimitiveTestImplementation.extendsFrom(configurations.testImplementation)
configurations.nativePrimitiveTestRuntimeOnly.extendsFrom(configurations.testRuntimeOnly)
['nativePrimitiveTestCompileClasspath', 'nativePrimitiveTestRuntimeClasspath'].each { name ->
    configurations.named(name) {
        attributes.attribute(org.gradle.api.attributes.java.TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, nativeTestJavaVersion)
    }
}
tasks.named('compileNativePrimitiveTestJava', JavaCompile) {
    javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(nativeTestJavaVersion) }
    options.release = nativeTestJavaVersion
}
tasks.register('nativePrimitiveTest', Test) {
    description = 'Verify the two shared Minecraft-free native widget/slot state primitives.'
    testClassesDirs = sourceSets.nativePrimitiveTest.output.classesDirs
    classpath = sourceSets.nativePrimitiveTest.runtimeClasspath
}
