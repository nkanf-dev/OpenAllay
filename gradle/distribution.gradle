import groovy.json.JsonSlurper

// The explicit prepare command is the only step that accesses Git remotes.
// Builder is one universal raw resource, not a loader-registered dependency.
def lockFile = file('distribution/extensions.lock.json')
def extensionLock = new JsonSlurper().parse(lockFile)
def lockFields = ['source', 'project', 'version', 'extensionId', 'openAllayApiVersion', 'artifact'] as Set
if (!(extensionLock instanceof Map) || extensionLock.keySet() != lockFields
        || !(extensionLock.source instanceof Map)
        || extensionLock.source.keySet() != (['repository', 'revision'] as Set)) {
    throw new GradleException('Extension lock fields do not match the current universal distribution shape')
}
def booleanProperty = { String name, String defaultValue ->
    def value = providers.gradleProperty(name).orElse(defaultValue).get()
    if (!(value in ['true', 'false'])) {
        throw new GradleException("${name} must be true or false")
    }
    value == 'true'
}
ext.bundleExtensions = booleanProperty('bundleExtensions', 'true')
ext.testBundledExtensions = booleanProperty('testBundledExtensions', 'true')

if (bundleExtensions) {
    def sourceDirectory = providers.gradleProperty('openallayExtensionsDir')
            .map { rootProject.file(it) }
            .orElse(layout.projectDirectory.dir('.gradle/distribution-sources/openallay-extensions').asFile)
    def extensionProject = new File(sourceDirectory.get(), extensionLock.project)
    def artifactFile = new File(extensionProject, extensionLock.artifact)
    def allowUnpinned = booleanProperty('allowUnpinnedExtensions', 'false')
    if (allowUnpinned && !providers.gradleProperty('openallayExtensionsDir').isPresent()) {
        throw new GradleException('allowUnpinnedExtensions requires an explicit openallayExtensionsDir')
    }
    def distributionDirectory = layout.buildDirectory.dir('distribution/bundled-extension-resources')
    def sdkJar = providers.provider {
        project(':extension-api').tasks.named('jar').get().archiveFile.get().asFile
    }
    def verifySource = tasks.register('verifyExtensionSource', Exec) {
        group = 'verification'
        description = 'Verify the prepared Extension checkout without network access or checkout changes.'
        inputs.file(lockFile)
        inputs.file(file('scripts/prepare-distribution.py'))
        inputs.property('sourceDirectory', sourceDirectory.get().absolutePath)
        inputs.property('allowUnpinned', allowUnpinned)
        // No output: Git HEAD and dirty state must be checked on every invocation.
        commandLine 'python3', file('scripts/prepare-distribution.py'), '--verify-only',
                '--manifest', lockFile, '--source-directory', sourceDirectory.get()
        if (allowUnpinned) args '--allow-unpinned'
        mustRunAfter tasks.matching { it.name == 'clean' }
    }

    def buildExtensions = tasks.register('buildBundledExtensions', Exec) {
        group = 'build'
        description = 'Build and test the pinned universal Extension against the public SDK JAR.'
        dependsOn verifySource, ':extension-api:jar'
        inputs.file(lockFile)
        inputs.file(sdkJar)
        outputs.file(artifactFile)
        // Always delegate. The independent build owns its own incremental checks.
        outputs.upToDateWhen { false }
        def wrapper = file(System.getProperty('os.name').toLowerCase().contains('windows') ? 'gradlew.bat' : 'gradlew')
        doFirst {
            def command = [wrapper, '--no-daemon', '--console=plain', '--gradle-user-home', gradle.gradleUserHomeDir,
                    '-p', extensionProject, "-PopenallayExtensionApiJar=${sdkJar.get().absolutePath}",
                    testBundledExtensions ? 'build' : 'assemble', 'verifyUniversalPackage']
            if (gradle.startParameter.taskNames.any { it == 'clean' || it == ':clean' }) {
                command.add(command.indexOf(testBundledExtensions ? 'build' : 'assemble'), 'clean')
            }
            if (gradle.startParameter.offline) command.add('--offline')
            commandLine command
        }
    }

    def stageExtensions = tasks.register('stageBundledExtensions', Exec) {
        group = 'build'
        description = 'Re-verify source, then stage the universal resource and its actual SHA-256 provenance.'
        dependsOn buildExtensions
        inputs.file(lockFile)
        inputs.file(artifactFile)
        inputs.files(file('scripts/prepare-distribution.py'), file('scripts/verify-bundled-extensions.py'))
        inputs.property('sourceDirectory', sourceDirectory.get().absolutePath)
        inputs.property('allowUnpinned', allowUnpinned)
        outputs.dir(distributionDirectory)
        // Provenance includes current Git state, even when artifact bytes did not change.
        outputs.upToDateWhen { false }
        commandLine 'python3', file('scripts/verify-bundled-extensions.py'), '--stage',
                '--manifest', lockFile, '--source-directory', sourceDirectory.get(),
                '--output-directory', distributionDirectory.get().asFile
        if (allowUnpinned) args '--allow-unpinned'
    }

    ['fabric', 'neoforge'].each { loader ->
        project(":${loader}") {
            tasks.withType(ProcessResources).configureEach {
                if (name == 'processResources') {
                    dependsOn stageExtensions
                    // The same output serves source-set development launches and loader JARs.
                    from(distributionDirectory)
                }
            }
        }
    }
}
