import org.gradle.api.file.SourceDirectorySet
import org.gradle.api.tasks.PathSensitivity

// Shared source families plus small exact-target overrides reuse one implementation.
def selectedTarget = rootProject.ext.minecraftTarget
def nativeFamily = rootProject.ext.minecraftNativeFamily
def families = rootProject.ext.minecraftNativeSourceFamilies
def javaRoots = [file('src/main/java')] + families.collect { file("src/targets/${it}/java") }
def resourceRoots = [file('src/main/resources')] + families.collect { file("src/targets/${it}/resources") }
if (!families.contains(selectedTarget)) {
    javaRoots.add(file("src/targets/${selectedTarget}/java"))
    resourceRoots.add(file("src/targets/${selectedTarget}/resources"))
}
def overridden = { element, List<File> roots ->
    if (element.directory) return false
    def index = roots.findIndexOf { element.file.toPath().startsWith(it.toPath()) }
    index >= 0 && roots.drop(index + 1).any { new File(it, element.relativePath.pathString).isFile() }
}
sourceSets.main.java {
    javaRoots.drop(1).each { srcDir(it) }
    exclude { element -> overridden(element, javaRoots) }
}
sourceSets.main.resources {
    resourceRoots.drop(1).each { srcDir(it) }
    exclude { element -> overridden(element, resourceRoots) }
}
// Native plugins use the exact same selected AT/access-widener resource.
ext.selectedMinecraftTargetResource = { String relativePath ->
    resourceRoots.reverse().collect { new File(it, relativePath) }.find { it.isFile() }
            ?: new File(resourceRoots.first(), relativePath)
}

// Java's package plus filename defines each primary compilation unit identity.
// Reject misplaced files as well as duplicate identities; do not silently hide a
// duplicate FQN at a different path. javac still validates all Java declarations.
def javaPackage = ~/(?m)^\s*package\s+([\p{javaJavaIdentifierStart}][\p{javaJavaIdentifierPart}]*(?:\.[\p{javaJavaIdentifierStart}][\p{javaJavaIdentifierPart}]*)*)\s*;/
def validateSources = { Collection<SourceDirectorySet> sourceDirectories ->
    def identities = [:]
    def visitedFiles = [] as Set
    sourceDirectories.each { directories ->
        directories.asFileTree.visit { element ->
            if (!element.directory && element.name.endsWith('.java') && visitedFiles.add(element.file)) {
                def matcher = javaPackage.matcher(element.file.getText('UTF-8'))
                def packageName = matcher.find() ? matcher.group(1) : ''
                def name = element.name.substring(0, element.name.length() - '.java'.length())
                def identity = packageName.empty ? name : "${packageName}.${name}"
                def expectedPath = (packageName.empty ? '' : packageName.replace('.', '/') + '/') + element.name
                if (element.relativePath.pathString != expectedPath) {
                    throw new GradleException("Java package/file path mismatch for ${identity}: ${element.file}; expected ${expectedPath}")
                }
                def previous = identities.put(identity, element.file)
                if (previous != null) {
                    throw new GradleException("Duplicate selected Java FQN ${identity}: ${previous} and ${element.file}")
                }
            }
        }
    }
}
def validateResources = { Collection<SourceDirectorySet> resourceDirectories ->
    def paths = [:]
    def visitedFiles = [] as Set
    resourceDirectories.each { directories ->
        directories.asFileTree.visit { element ->
            if (!element.directory && visitedFiles.add(element.file)) {
                def path = element.relativePath.pathString
                def previous = paths.put(path, element.file)
                if (previous != null) {
                    throw new GradleException("Duplicate selected resource ${path}: ${previous} and ${element.file}")
                }
            }
        }
    }
}
// Loaders use these checks on their own sources AND the selected common sources.
ext.validateSelectedMinecraftJava = validateSources
ext.validateSelectedMinecraftResources = validateResources

def validateSelection = tasks.register('validateMinecraftTargetSources') {
    group = 'verification'
    description = 'Reject duplicate selected native/shared Java and resource paths.'
    inputs.property('minecraftTarget', selectedTarget)
    inputs.files(sourceSets.main.allJava).withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.files(sourceSets.main.resources).withPathSensitivity(PathSensitivity.RELATIVE)
    // Run even when a newly added duplicate has byte-identical contents.
    outputs.upToDateWhen { false }
    doLast {
        validateSources([sourceSets.main.allJava])
        validateResources([sourceSets.main.resources])
    }
}
tasks.configureEach {
    if (name in ['compileJava', 'processResources', 'javadoc', 'sourcesJar']) {
        dependsOn(validateSelection)
        inputs.property('minecraftTarget', selectedTarget)
    }
}
