import java.util.Properties
import groovy.json.JsonSlurper

// External target pins only. This is not an internal format/version registry.
if (project != rootProject) {
    throw new GradleException('Minecraft target profiles must be selected by the root project')
}
def nativeFamilies = ['1.19.2': '1.19.2', '1.20.1': '1.20.1', '1.20.2': '1.20.2', '1.20.3': '1.20.3', '1.20.4': '1.20.4', '1.20.5': '1.20.6', '1.20.6': '1.20.6', '1.21': '1.21.1', '1.21.1': '1.21.1', '1.21.2': '1.21.3', '1.21.3': '1.21.3', '1.21.4': '1.21.4', '1.21.5': '1.21.5', '1.21.6': '1.21.6', '1.21.7': '1.21.8', '1.21.8': '1.21.8', '1.21.9': '1.21.10', '1.21.10': '1.21.10', '1.21.11': '1.21.11', '26.1': '26.1', '26.1.1': '26.1', '26.1.2': '26.1', '26.2': '26.2', '26.3': '26.3']
def nativeFamilyParents = ['1.19.2': '1.20.1', '1.20.1': '1.20.2', '1.20.2': '1.20.3', '1.20.3': '1.20.4', '1.20.4': '1.20.6', '1.20.6': '1.21.1', '1.21.1': '1.21.3', '1.21.3': '1.21.4', '1.21.4': '1.21.5', '1.21.5': '1.21.6', '1.21.6': '1.21.8', '1.21.8': '1.21.10', '1.21.10': '1.21.11']
def loaderMapFile = rootProject.file('gradle/minecraft-target-loaders.json')
def targetLoaders = new JsonSlurper().parse(loaderMapFile)
if (!(targetLoaders instanceof Map) || targetLoaders.keySet() != nativeFamilies.keySet()) {
    throw new GradleException('Target loader map must exactly match native source target selectors')
}
targetLoaders.each { target, entry ->
    if (!(entry instanceof Map) || entry.keySet() != (['loaders', 'nativeToolchain'] as Set)
            || !(entry.loaders instanceof List) || entry.loaders.empty
            || entry.loaders.any { !(it in ['fabric', 'forge', 'neoforge']) }
            || entry.loaders.toSet().size() != entry.loaders.size()
            || !(entry.nativeToolchain in ['legacyForge', 'neoForge'])
            || (entry.loaders.contains('forge') && (entry.nativeToolchain != 'legacyForge' || entry.loaders.contains('neoforge')))) {
        throw new GradleException("Invalid actual target loader selection: ${target}")
    }
}
def supportedTargets = targetLoaders.keySet().toList()
def selectedTarget = providers.gradleProperty('minecraftTarget').getOrElse('26.2')
if (!(selectedTarget in supportedTargets)) {
    throw new GradleException("Unknown minecraftTarget '${selectedTarget}'; choose ${supportedTargets.join(', ')}")
}
def modernProfileFields = [
    'java_version',
    'minecraft_version',
    'minecraft_version_range',
    'neo_form_version',
    'fabric_version',
    'fabric_loader_version',
    'neoforge_version',
    'neoforge_loader_version_range',
    'jei_version',
    'rei_version',
    'architectury_version',
    'fabric_command_api_version',
    'fabric_resource_loader_version',
    'fabric_networking_api_version',
    'fabric_message_api_version',
    'fabric_lifecycle_events_version',
    'fabric_key_mapping_api_version',
    'fabric_rendering_version'
] as Set
def forgeProfileFields = ['java_version', 'minecraft_version', 'minecraft_version_range',
        'mcp_version', 'forge_version', 'forge_loader_version_range',
        'jei_version', 'rei_version', 'architectury_version'] as Set
def selectedLoaders = targetLoaders[selectedTarget].loaders.asImmutable()
def nativeToolchain = targetLoaders[selectedTarget].nativeToolchain
def profileFields = selectedLoaders.contains('forge') ? forgeProfileFields : modernProfileFields
def allProfileFields = modernProfileFields + forgeProfileFields

def profileFile = rootProject.file("gradle/minecraft-targets/${selectedTarget}.properties")
if (!profileFile.isFile()) {
    throw new GradleException("Missing Minecraft target profile: ${profileFile}")
}
// Properties handles its standard syntax. Reject duplicate keys instead of last-one-wins.
def properties = new Properties() {
    @Override
    synchronized Object put(Object key, Object value) {
        if (containsKey(key)) {
            throw new GradleException("Duplicate Minecraft target profile field: ${key}")
        }
        return super.put(key, value)
    }
}
profileFile.withReader('UTF-8') { reader -> properties.load(reader) }
def actualFields = properties.stringPropertyNames()
def missingFields = profileFields - actualFields
def unknownFields = actualFields - profileFields
if (!missingFields.empty || !unknownFields.empty) {
    throw new GradleException("Invalid Minecraft target profile fields; missing=${missingFields}, unknown=${unknownFields}")
}
def profile = profileFields.collectEntries { key ->
    def value = properties.getProperty(key)
    if (value == null || value.isBlank() || value != value.trim()) {
        throw new GradleException("Empty or padded Minecraft target profile field: ${key}")
    }
    [(key): value]
}.asImmutable()
if (profile.minecraft_version != selectedTarget || !(profile.java_version ==~ /[1-9][0-9]*/)) {
    throw new GradleException('Minecraft target profile must match its native game version and declare a Java major')
}
// No command-line/user/root property may silently compete with the selected tuple.
allProfileFields.each { key ->
    if (providers.gradleProperty(key).isPresent()) {
        throw new GradleException("Minecraft target field '${key}' collides with a Gradle property; select minecraftTarget instead")
    }
}
def reservedExtraFields = allProfileFields + ['minecraftTargetProfile', 'minecraftTargetLoaders', 'minecraftNativeToolchain']
allprojects { candidate ->
    reservedExtraFields.each { key ->
        if (candidate.extensions.extraProperties.has(key)) {
            throw new GradleException("Minecraft target field '${key}' collides with an existing property in ${candidate.path}")
        }
    }
}
allprojects { candidate ->
    candidate.extensions.extraProperties.set('minecraftTarget', selectedTarget)
    candidate.extensions.extraProperties.set('minecraftTargetLoaders', selectedLoaders)
    candidate.extensions.extraProperties.set('minecraftNativeToolchain', nativeToolchain)
    candidate.extensions.extraProperties.set('minecraftNativeFamily', nativeFamilies[selectedTarget])
    def family = nativeFamilies[selectedTarget]
    def roots = [family]
    while (nativeFamilyParents.containsKey(roots.first())) roots.add(0, nativeFamilyParents[roots.first()])
    candidate.extensions.extraProperties.set('minecraftNativeSourceFamilies', roots)
    candidate.extensions.extraProperties.set('jeiArtifactTarget', ['1.20.3': '1.20.4', '1.20.5': '1.20.6', '1.21': '1.21.1', '1.21.2': '1.21.1', '1.21.3': '1.21.1', '1.21.6': '1.21.5'].getOrDefault(selectedTarget, selectedTarget))
    candidate.extensions.extraProperties.set('minecraftTargetProfile', profile)
    profile.each { key, value -> candidate.extensions.extraProperties.set(key, value) }
}

tasks.register('printMinecraftTarget') {
    group = 'help'
    description = 'Print selected native game pins; a profile is not a support declaration.'
    inputs.files(profileFile, loaderMapFile)
    inputs.property('minecraftTarget', selectedTarget)
    doLast {
        println("minecraftTarget=${selectedTarget}")
        println("minecraftTargetLoaders=${selectedLoaders.join(',')}")
        println("minecraftNativeToolchain=${nativeToolchain}")
        profile.each { key, value -> println("${key}=${value}") }
    }
}
