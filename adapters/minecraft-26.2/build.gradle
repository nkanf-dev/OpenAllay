plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
}

apply from: rootProject.file('gradle/minecraft-source-family.gradle')

group = 'dev.openallay'
version = rootProject.version
base { archivesName = "openallay-minecraft-${minecraft_version}-world-adapter" }

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

neoForge {
    neoFormVersion = neo_form_version
}

dependencies {
    // The host supplies the sole SDK identity. No common/core or Extension domain dependency.
    compileOnly(project(':extension-api'))
    // Minecraft and its Gson/serialization libraries come from the NeoForm compile artifact.
    // Do not add game libraries to the SDK or publish another runtime copy of Gson.
    testImplementation(project(':extension-api'))
    testImplementation('org.junit.jupiter:junit-jupiter:5.11.4')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher:1.11.4')
    testImplementation('com.google.code.gson:gson:2.13.2')
}

tasks.withType(Jar).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty('minecraft26Adapter.sources', file('src/main/java').absolutePath)
    systemProperty('minecraft26Adapter.classes', sourceSets.main.output.classesDirs.asPath)
    systemProperty('minecraft26Adapter.buildFile', file('build.gradle').absolutePath)
}

// Native regression tests execute against the exact NeoForm game classes/libraries.
configurations.testCompileClasspath.extendsFrom(configurations.compileClasspath)
configurations.testRuntimeClasspath.extendsFrom(configurations.compileClasspath)

// Explicit cross-repository fixture produced by the one shared Builder algorithm suite.
tasks.named('test') {
    def states = providers.gradleProperty('sharedPresetStates')
    if (states.isPresent()) systemProperty('sharedPresetStates', states.get())
}
