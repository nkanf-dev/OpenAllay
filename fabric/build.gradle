plugins {
    id 'multiloader-loader'
}
// Select before configuring Loom; both IDs use the same cached implementation.
def remapMinecraft = minecraftTarget.startsWith('1.')
pluginManager.apply(remapMinecraft ? 'net.fabricmc.fabric-loom-remap' : 'net.fabricmc.fabric-loom')
def modImplementationConfiguration = remapMinecraft ? 'modImplementation' : 'implementation'
def modCompileOnlyConfiguration = remapMinecraft ? 'modCompileOnly' : 'compileOnly'
def keyApiArtifact = remapMinecraft ? 'fabric-key-binding-api-v1' : 'fabric-key-mapping-api-v1'
def resourceApiArtifact = minecraftNativeSourceFamilies.contains('1.21.8') ? 'fabric-resource-loader-v0' : 'fabric-resource-loader-v1'
dependencies {
    implementation(project(":engine-core"))
    implementation(project(":adapters:minecraft"))
    if (!remapMinecraft) include(project(":adapters:minecraft"))
    implementation(project(":extension-api"))
    include(project(":extension-api"))
    minecraft("com.mojang:minecraft:${minecraft_version}")
    if (remapMinecraft) mappings(loom.officialMojangMappings())
    add(modImplementationConfiguration, "net.fabricmc:fabric-loader:${fabric_loader_version}")
    add(modImplementationConfiguration, "net.fabricmc.fabric-api:fabric-command-api-v2:${fabric_command_api_version}")
    add(modImplementationConfiguration, "net.fabricmc.fabric-api:${resourceApiArtifact}:${fabric_resource_loader_version}")
    add(modImplementationConfiguration, "net.fabricmc.fabric-api:fabric-networking-api-v1:${fabric_networking_api_version}")
    add(modImplementationConfiguration, "net.fabricmc.fabric-api:fabric-message-api-v1:${fabric_message_api_version}")
    add(modImplementationConfiguration, "net.fabricmc.fabric-api:fabric-lifecycle-events-v1:${fabric_lifecycle_events_version}")
    add(modImplementationConfiguration, "net.fabricmc.fabric-api:${keyApiArtifact}:${fabric_key_mapping_api_version}")
    add(modImplementationConfiguration, "net.fabricmc.fabric-api:fabric-rendering-v1:${fabric_rendering_version}")
    implementation(include("org.xerial:sqlite-jdbc:${sqlite_jdbc_version}"))
    implementation(include("org.commonmark:commonmark:${commonmark_version}"))
    implementation(include("org.commonmark:commonmark-ext-gfm-tables:${commonmark_version}"))
    implementation(include(project(':runtime-rhino')))
    implementation(include("com.knuddels:jtokkit:${jtokkit_version}"))
    if (minecraftNativeSourceFamilies.contains('1.21.3') || minecraftTarget == '1.21.4') {
        // These targets use the independently published named common API.
        // Compile against its actual public contracts; never bundle or remap the API itself.
        compileOnly("mezz.jei:jei-${jeiArtifactTarget}-common-api:${jei_version}") { transitive = false }
    } else {
        add(modCompileOnlyConfiguration, "mezz.jei:jei-${jeiArtifactTarget}-fabric-api:${jei_version}")
    }
    add(modCompileOnlyConfiguration, "me.shedaniel:RoughlyEnoughItems-api-fabric:${rei_version}")
    add(modCompileOnlyConfiguration, "dev.architectury:architectury-fabric:${architectury_version}")
}

loom {
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet project(':engine-core').sourceSets.main
        }
    }
    if (minecraftTarget == '1.20.1') {
        mixin {
            useLegacyMixinAp.set(true)
            defaultRefmapName.set('openallay.refmap.json')
        }
    }
    def aw = project(':common').selectedMinecraftTargetResource("${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

tasks.matching { it.name == 'runClient' }.configureEach {
    System.properties.findAll { key, value -> key.toString().startsWith('openallay.e2e.') }
            .each { key, value -> systemProperty(key.toString(), value.toString()) }
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}

// Feature code is compiled once without game dependencies and reused in the game mod layer.
tasks.named('jar', Jar) {
    dependsOn(':engine-core:classes')
    from({ project(':engine-core').sourceSets.main.output })
}

// NeoForm supplies named native bytecode, not a pre-remapped nested Fabric mod.
// Merge only on the obfuscated family so remapJar transforms the adapter too.
if (remapMinecraft) {
    tasks.named('jar', Jar) {
        dependsOn(':adapters:minecraft:classes')
        from({ project(':adapters:minecraft').sourceSets.main.output })
    }
    def remappedNative = tasks.named('remapJar') {
        archiveClassifier.set('remapped-native')
    }
    def packaged = tasks.register('packageSharedEngineJar', Jar) {
        dependsOn(remappedNative, ':engine-core:classes')
        archiveFileName.set("${base.archivesName.get()}-${project.version}.jar")
        destinationDirectory.set(layout.buildDirectory.dir('libs'))
        def engineOutput = project(':engine-core').sourceSets.main.output
        def engineEntryNames = providers.provider {
            engineOutput.asFileTree.collect { file ->
                def root = engineOutput.files.find { directory -> file.toPath().startsWith(directory.toPath()) }
                root.toPath().relativize(file.toPath()).toString().replace('\\', '/')
            }.toSet()
        }
        from({ zipTree(remappedNative.get().archiveFile.get().asFile) }) {
            exclude 'META-INF/MANIFEST.MF', "LICENSE_${mod_name}"
            exclude { entry -> engineEntryNames.get().contains(entry.relativePath.pathString) }
        }
        from(engineOutput)
        doFirst {
            new java.util.jar.JarFile(remappedNative.get().archiveFile.get().asFile).withCloseable { input ->
                manifest.attributes(input.manifest.mainAttributes.collectEntries { key, value ->
                    [(key.toString()): value.toString()]
                })
            }
        }
    }
    tasks.named('assemble') { dependsOn(packaged) }
}
