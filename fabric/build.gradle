plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}
dependencies {
    implementation(project(":engine-core"))
    implementation(project(":adapters:minecraft-26.2"))
    include(project(":adapters:minecraft-26.2"))
    implementation(project(":extension-api"))
    include(project(":extension-api"))
    implementation("org.apache.maven:maven-artifact:3.9.9")
    include("org.apache.maven:maven-artifact:3.9.9")
    minecraft("com.mojang:minecraft:${minecraft_version}")
    implementation("net.fabricmc:fabric-loader:${fabric_loader_version}")
    implementation("net.fabricmc.fabric-api:fabric-command-api-v2:${fabric_command_api_version}")
    implementation("net.fabricmc.fabric-api:fabric-resource-loader-v1:${fabric_resource_loader_version}")
    implementation("net.fabricmc.fabric-api:fabric-networking-api-v1:${fabric_networking_api_version}")
    implementation("net.fabricmc.fabric-api:fabric-lifecycle-events-v1:${fabric_lifecycle_events_version}")
    implementation("net.fabricmc.fabric-api:fabric-key-mapping-api-v1:${fabric_key_mapping_api_version}")
    implementation("net.fabricmc.fabric-api:fabric-rendering-v1:${fabric_rendering_version}")
    implementation(include("org.xerial:sqlite-jdbc:${sqlite_jdbc_version}"))
    implementation(include("org.commonmark:commonmark:${commonmark_version}"))
    implementation(include("org.commonmark:commonmark-ext-gfm-tables:${commonmark_version}"))
    implementation(include("dev.latvian.mods:rhino:${rhino_version}"))
    implementation(include("com.knuddels:jtokkit:${jtokkit_version}"))
    compileOnly("mezz.jei:jei-${minecraft_version}-fabric-api:${jei_version}")
    compileOnly("me.shedaniel:RoughlyEnoughItems-api-fabric:${rei_version}")
    compileOnly("dev.architectury:architectury-fabric:${architectury_version}")
}

loom {
    def aw = project(':common').selectedMinecraftTargetResource("${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

tasks.matching { it.name == 'runClient' }.configureEach {
    System.properties.findAll { key, value -> key.toString().startsWith('openallay.e2e.') }
            .each { key, value -> systemProperty(key.toString(), value.toString()) }
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}

// Feature code is compiled once without game dependencies and reused in the game mod layer.
tasks.named('jar', Jar) {
    dependsOn(':engine-core:classes')
    from({ project(':engine-core').sourceSets.main.output })
}
