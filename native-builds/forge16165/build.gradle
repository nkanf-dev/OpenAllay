def mappingFiles = parse(request.mappingInputs)
if (mappingFiles.keySet() != (['client','server','tsrg'] as Set) || mappingFiles.values().any {
    !(it instanceof Map) || it.keySet() != (['path','sha256'] as Set) ||
    !(it.path instanceof String) || !new File(it.path).isAbsolute() || !(it.sha256 ==~ /[0-9a-f]{64}/)
}) throw new GradleException('Exact mapping input identity required')
def ancestors = ['1.21.11', '1.21.10', '1.21.8', '1.21.6', '1.21.5', '1.21.4',
        '1.21.3', '1.21.1', '1.20.6', '1.20.4', '1.20.3', '1.20.2', '1.20.1', '1.19.2', '1.18.2']
if (plan.keySet() != (['minecraft', 'forge', 'forgeGradle', 'gradle', 'sourceFamilies',
        'actualMcpUnits', 'sourceSyntax', 'preview'] as Set) ||
        plan.minecraft != '1.16.5' || plan.forge != '1.16.5-36.2.42' ||
        plan.forgeGradle != '6.0.54' || plan.gradle != '8.4' || plan.sourceFamilies != ancestors ||
        !(plan.actualMcpUnits instanceof List) || plan.actualMcpUnits.toSet().size() != plan.actualMcpUnits.size() ||
        plan.sourceSyntax != '17' || plan.preview != false) {
