    from(selected.javaSets)
    from(selected.resourceSets)
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    duplicatesStrategy = DuplicatesStrategy.FAIL
}
def before = layout.buildDirectory.file('native-metadata/native-before-reobf.jar')
def snapshot = tasks.register('snapshotNativeJar',Copy) {
    dependsOn tasks.named('jar')
    from(tasks.named('jar',Jar).flatMap { it.archiveFile })
    into(before.map { it.asFile.parentFile })
    rename { 'native-before-reobf.jar' }
}
// FG registers normal reobfJar after evaluation. Never look it up eagerly.
tasks.matching { it.name == 'reobfJar' }.configureEach {
    dependsOn snapshot
    extraMappings.from(apMappings)
}
tasks.register('emitNativeBuildMetadata') {
    dependsOn 'reobfJar'
    outputs.file(layout.buildDirectory.file('native-metadata/build.json'))
    // Normal FG reobf replaces native bytes in place; always refresh their cheap custody receipt.
    outputs.upToDateWhen { false }
    doLast {
        def after = tasks.named('jar',Jar).get().archiveFile.get().asFile
        jsonWrite(layout.buildDirectory.file('native-metadata/build.json').get().asFile,
            [sourceRevision:request.sourceRevision,minecraft:'1.16.5',forge:'36.2.42',forgeGradle:'6.0.54',
             gradle:gradle.gradleVersion,daemonJdk:System.getProperty('java.runtime.version'),
             nativeCompilerRelease:17,producerToolingJdk:normalize.get().javaLauncher.get().metadata.installationPath.asFile.absolutePath,
             before:[path:before.get().asFile.absolutePath,sha256:sha(before.get().asFile)],
             reobf:[path:after.absolutePath,sha256:sha(after)],
             selectionSha256:sha(selectionReceipt.get().asFile),namespaceSha256:sha(namespaceReceipt.get().asFile),
             apRefmapSha256:sha(apRefmap.get().asFile),apMappingsSha256:sha(apMappings.get().asFile),
             normalMappingsSha256:sha(nativeMappings.get().asFile),closureSpecSha256:sha(file(request.closureSpec)),
             compilerLockSha256:sha(file(request.compilerArtifactLock)),sharedClosurePacked:false,gameExecuted:false])
    }
}
