def reiCompileView = tasks.register('reiCompileView', Jar) {
    inputs.files(configurations.reiMappedInput)
    from({ zipTree(configurations.reiMappedInput.singleFile) }) {
        include 'me/shedaniel/rei/**/*.class'
    }
