    duplicatesStrategy = DuplicatesStrategy.FAIL
    def props = ['version':version,'mod_name':product.getProperty('mod_name'),
        'mod_id':product.getProperty('mod_id'),'mod_author':product.getProperty('mod_author'),
        'license':product.getProperty('license'),'description':product.getProperty('description'),
