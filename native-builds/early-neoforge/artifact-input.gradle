import org.gradle.api.attributes.Bundling
import org.gradle.api.attributes.Category
import org.gradle.api.attributes.LibraryElements
import org.gradle.api.attributes.Usage
import org.gradle.api.attributes.java.TargetJvmVersion

// No sources, compiler, fake alias, or publication. Expose the existing real JAR.
def record = rootProject.ext.earlyInputs[project.name == 'extension-api' ? 'sdk' : 'rhino']
if (record.name != project.name || record.group != 'dev.openallay') {
    throw new GradleException('Reused artifact project identity differs')
}
group = record.group
version = record.version
configurations.create('runtimeElements') {
    canBeResolved = false
    canBeConsumed = true
    attributes {
        attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_RUNTIME))
        attribute(Category.CATEGORY_ATTRIBUTE, objects.named(Category, Category.LIBRARY))
        attribute(LibraryElements.LIBRARY_ELEMENTS_ATTRIBUTE, objects.named(LibraryElements, LibraryElements.JAR))
        attribute(Bundling.BUNDLING_ATTRIBUTE, objects.named(Bundling, Bundling.EXTERNAL))
        attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, project.name == 'extension-api' ? 8 : 17)
        attribute(Attribute.of('jarJarRange', String), "[${record.version}]".toString())
    }
    outgoing.artifact(file(record.path))
}
