name: Release
'on':
  workflow_dispatch:
  push:
    tags:
    - v*
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    name: Publish verified unchanged ${{ github.ref_name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OPENALLAY_MINECRAFT_TARGET: '26.2'
      OPENALLAY_MINECRAFT_RECEIPT_DIRECTORY: build/release-receipts
    permissions:
      contents: write
      actions: read
    steps:
    - name: Check out annotated tag history
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      with:
        fetch-depth: 0
        fetch-tags: true
        persist-credentials: false
    - name: Validate tag and release vacancy
      env:
        GH_TOKEN: ${{ github.token }}
      run: ./scripts/verify-release-tag.sh "${GITHUB_REF_NAME}" "${GITHUB_SHA}"
    - name: Validate Modrinth credential
      env:
        MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      run: test -n "${MODRINTH_TOKEN}"
    - name: Resolve the original accepted files once and retain the same immutable cache
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        python3 -B scripts/fill-original-selection-entries.py --root "$PWD" --draft distribution/accepted-release-artifacts.inputs.json --cache build/accepted-originals --output distribution/accepted-release-artifacts.json --member-receipt build/accepted-original-members.json
    - name: Stage the original bytes and bind existing proof to final release paths
      run: |-
        python3 -B scripts/promote-accepted-artifacts.py stage > release-publication-records.json
        python3 -B scripts/build-minecraft-artifacts.py publication-records release --receipt-directory build/release-receipts > release-publication-records.json
    - name: Retain final-byte receipts and publication records
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: release-receipts-${{ github.sha }}-${{ github.run_attempt }}
        retention-days: 7
        if-no-files-found: error
        path: |-
          build/release-receipts/
          release-publication-records.json
          build/accepted-original-members.json
    - name: Generate release notes
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 scripts/generate-release-notes.py "${GITHUB_REF_NAME}" --repository "${GITHUB_REPOSITORY}" --output
        release-notes.md
    - name: Publish Fabric and NeoForge to Modrinth
      env:
        MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      run: ./scripts/publish-modrinth.sh "${GITHUB_REF_NAME}" release
    - name: Publish GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        set -euo pipefail
        release_flags=()
        if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
          release_flags+=(--prerelease)
        fi
        gh release create "${GITHUB_REF_NAME}" \
          release/openallay-*.jar \
          release/SHA256SUMS \
          release/accepted-originals.json \
          release-publication-records.json \
          --fail-on-no-commits \
          --notes-file release-notes.md \
          --title "OpenAllay ${GITHUB_REF_NAME}" \
          --verify-tag \
          "${release_flags[@]}"
