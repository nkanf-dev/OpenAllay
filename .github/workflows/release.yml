name: Release
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Annotated tag bound to the package build source
        required: true
        default: v0.4.3
        type: string
      build_run_id:
        description: Successful release package build run
        required: true
        type: string
      build_source_sha:
        description: Exact package build source commit
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.release_tag }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      OPENALLAY_MINECRAFT_TARGET: '26.2'
      OPENALLAY_MINECRAFT_BUILD_RECEIPT_DIRECTORY: release/build-receipts
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Verify release tag and source-bound successful package run
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          BUILD_SOURCE_SHA: ${{ inputs.build_source_sha }}
        run: python3 -B scripts/verify-release-package-source.py
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run_id }}
          name: release-staged-${{ inputs.build_source_sha }}
          path: release
      - name: Check retained compile-package receipts against final publication paths
        run: python3 -B scripts/build-minecraft-artifacts.py publication-records release --build-receipt-directory release/build-receipts > release-publication-records.json
      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/generate-release-notes.py "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY" --output release-notes.md
      - name: Publish all selected loaders to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: ./scripts/publish-modrinth.sh "$RELEASE_TAG" release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/publish-current-github-release.py
      - name: Preserve exact publication records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-publication-${{ inputs.release_tag }}-${{ github.sha }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            release-publication-records.json
            release/build-receipts/
            release/SHA256SUMS
            release-notes.md
