name: Quality

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
  # Validation branches dispatch full batches or only failed/affected clients.
  workflow_dispatch:
    inputs:
      mode:
        description: "full runs all gates and both clients; clients reuses verified JARs"
        type: choice
        options: [clients, full]
        required: true
        default: clients
      client_loaders:
        description: "Exact failed/affected fabric,neoforge CSV; none selects no clients"
        type: string
        required: true
        default: none
      client_scenarios:
        description: "Optional exact diagnostic scenarios; empty runs the complete suite"
        type: string
        required: false
      artifact_run_id:
        description: "Prior successful Quality verifier run ID, only for selected clients"
        type: string
        required: false
      artifact_source_sha:
        description: "Exact 40-character source SHA of that verified production artifact"
        type: string
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  # Client-only repair dispatches do not cancel independent full verification.
  group: quality-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ inputs.mode || 'full' }}-${{ inputs.client_loaders || 'none' }}
  cancel-in-progress: true

jobs:
  plan:
    name: Select mainline verification jobs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run_verify: ${{ steps.plan.outputs.run_verify }}
      run_client: ${{ steps.plan.outputs.run_client }}
      client_matrix: ${{ steps.plan.outputs.client_matrix }}
    steps:
      - name: Check out candidate and artifact source history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test exact client selection and artifact-source decisions
        run: |
          python3 -B -m unittest discover -s scripts -p 'test_plan_ci_verification.py'
          python3 -B -m unittest discover -s scripts -p 'test_plan_quality_verification.py'

      - name: Select only requested failed or affected clients
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && (inputs.mode || 'clients') || 'full' }}
          CLIENT_LOADERS: ${{ github.event_name == 'workflow_dispatch' && inputs.client_loaders || 'none' }}
          SOURCE_RUN_ID: ${{ inputs.artifact_run_id }}
          SOURCE_SHA: ${{ inputs.artifact_source_sha }}
          RUN_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 -B scripts/plan-quality-verification.py \
            --mode "$MODE" --client-loaders "$CLIENT_LOADERS" \
            --candidate-sha "$GITHUB_SHA" --current-run-id "$GITHUB_RUN_ID" --current-run-head-sha "$RUN_HEAD_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --source-run-id "$SOURCE_RUN_ID" --source-sha "$SOURCE_SHA" \
            --report quality-verification-plan.json --github-output "$GITHUB_OUTPUT"

      - name: Retain exact Quality job selection and original artifact source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quality-plan-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: quality-verification-plan.json

      - name: Record runner and production artifact identities separately
        run: |
          printf '### Mainline verification plan\n\nCandidate runner: `%s`. Prior successful verifier evidence belongs to its original source SHA. Production JAR source is recorded per client.\n\n```json\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          cat quality-verification-plan.json >> "$GITHUB_STEP_SUMMARY"
          printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"

  verify:
    name: Minecraft 26.2
    needs: plan
    if: ${{ needs.plan.outputs.run_verify == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      # Only the accepted default target is gated/published here; no target matrix.
      OPENALLAY_MINECRAFT_TARGET: "26.2"
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Read selected Minecraft target Java pin
        id: minecraft_target
        run: |
          java_version=$(python3 scripts/minecraft-target.py \
            --target "$OPENALLAY_MINECRAFT_TARGET" --property java_version)
          printf 'java_version=%s\n' "$java_version" >> "$GITHUB_OUTPUT"

      - name: Set up target Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: ${{ steps.minecraft_target.outputs.java_version }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Validate automation sources
        run: |
          bash -n scripts/*.sh
          python3 -m py_compile scripts/*.py

      - name: Test Minecraft target source and tooling contracts
        run: python3 -m unittest discover -s scripts -p 'test_minecraft_target*.py'

      - name: Test distribution automation
        run: python3 -m unittest discover -s scripts -p 'test_distribution*.py'

      - name: Test client acceptance tooling
        run: |
          python3 -B -m unittest discover -s scripts -p 'test_ci_*.py'
          python3 -B -m unittest discover -s scripts -p 'test_packaged_builder_acceptance.py'

      - name: Prepare pinned Extension source
        run: python3 scripts/prepare-distribution.py

      - name: Run clean test and loader build gate
        run: ./gradlew --stacktrace -PminecraftTarget="$OPENALLAY_MINECRAFT_TARGET" clean :extension-api:test :common:test :fabric:build :neoforge:build

      - name: Retain shared test and build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mainline-test-reports-${{ github.sha }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            extension-api/build/test-results/
            extension-api/build/reports/
            engine-core/build/test-results/
            engine-core/build/reports/
            common/build/test-results/
            common/build/reports/
            fabric/build/test-results/
            fabric/build/reports/
            neoforge/build/test-results/
            neoforge/build/reports/
            build/reports/problems/

      - name: Verify SQLite packaging
        run: ./scripts/verify-sqlite-packaging.sh

      - name: Verify tokenizer packaging
        run: |
          minecraft_version=$(python3 scripts/minecraft-target.py \
            --target "$OPENALLAY_MINECRAFT_TARGET" --property minecraft_version)
          version=$(sed -n 's/^version=//p' gradle.properties)
          python3 scripts/verify-tokenizer-packaging.py \
            --fabric "fabric/build/libs/openallay-fabric-${minecraft_version}-${version}.jar" \
            --neoforge "neoforge/build/libs/openallay-neoforge-${minecraft_version}-${version}.jar"

      - name: Verify distribution
        run: ./scripts/verify-distribution.sh

      - name: Stage the exact production JARs for client acceptance
        run: |
          python3 -B scripts/stage-ci-client-production.py

      - name: Retain the exact tested production JARs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: client-production-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            build/ci-client-production/*.jar
            build/ci-client-production/SHA256SUMS

  client:
    name: Packaged client ${{ matrix.loader }}
    needs: [plan, verify]
    # In clients mode the verifier is intentionally skipped, not rerun.
    if: ${{ always() && !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.run_client == 'true' && (needs.plan.outputs.run_verify == 'false' || needs.verify.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.client_matrix) }}
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
      ALSOFT_DRIVERS: "null"
      # JAR source stays exact even when the repair runner has a newer head.
      OPENALLAY_E2E_SOURCE_REVISION: ${{ matrix.source_sha }}
    steps:
      - name: Check out the candidate client runner source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up the real game Java runtime
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Install the headless display and software graphics tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libgl1-mesa-dri libglx-mesa0 libegl1 libopenal1 webp
          python3 -m venv build/ci-tools
          build/ci-tools/bin/python -m pip install Pillow==11.3.0

      - name: Verify client orchestration and lossless image tooling
        run: |
          build/ci-tools/bin/python -B -m unittest discover -s scripts -p 'test_ci_*.py' -v
          build/ci-tools/bin/python -B -m unittest discover -s scripts -p 'test_packaged_builder_acceptance.py' -v

      - name: Download this run's exact Quality verification plan
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: quality-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ci-verification

      - name: Read the exact successful Quality artifact source job
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ matrix.source_run_id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > build/ci-verification/source-run.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/jobs?filter=latest&per_page=100" > build/ci-verification/source-job-pages.json
          python3 -c 'import json; from pathlib import Path; p = Path("build/ci-verification"); pages = json.loads((p / "source-job-pages.json").read_text()); (p / "source-jobs.json").write_text(json.dumps([job for page in pages for job in page["jobs"]]))'

      - name: Download the exact verified production JARs
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: client-production-${{ matrix.source_sha }}
          run-id: ${{ matrix.source_run_id }}
          github-token: ${{ github.token }}
          path: build/ci-client-production

      - name: Verify the downloaded original artifact checksums
        run: sha256sum --check SHA256SUMS
        working-directory: build/ci-client-production

      - name: Retain exact verifier source, attempt and original JAR SHA-256
        env:
          LOADER: ${{ matrix.loader }}
        run: |
          python3 -B scripts/plan-quality-verification.py --repository "$GITHUB_REPOSITORY" \
            --report build/ci-verification/quality-verification-plan.json --receipt-loader "$LOADER" \
            --artifact-directory build/ci-client-production \
            --source-run-json build/ci-verification/source-run.json \
            --source-jobs-json build/ci-verification/source-jobs.json \
            --receipt build/ci-verification/artifact-source.json
          printf '### Exact mainline client artifact source\n```json\n' >> "$GITHUB_STEP_SUMMARY"
          cat build/ci-verification/artifact-source.json >> "$GITHUB_STEP_SUMMARY"
          printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"

      - name: Provision the official isolated game runtime
        run: |
          python3 -B scripts/prepare-ci-minecraft-runtime.py             --loader "${{ matrix.loader }}" --java "$JAVA_HOME/bin/java"             --minecraft-root "$PWD/build/e2e/runtime/26.2/minecraft"             > build/ci-runtime-receipt.json

      - name: Prepare verified official game assets
        run: |
          python3 -B scripts/run-packaged-builder-acceptance.py --prepare-assets             --minecraft-root "$PWD/build/e2e/runtime/26.2/minecraft"             --assets-root "$PWD/build/e2e/runtime/26.2/assets"

      - name: Run deterministic real client acceptance scenarios
        env:
          CLIENT_SCENARIOS: ${{ inputs.client_scenarios }}
        run: |
          scenario_args=()
          if [[ -n "$CLIENT_SCENARIOS" ]]; then
            read -r -a scenarios <<< "$CLIENT_SCENARIOS"
            scenario_args=(--scenarios "${scenarios[@]}")
          fi
          xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24"             python3 -B scripts/run-ci-game-workflow.py --loader "${{ matrix.loader }}"             --java "$JAVA_HOME/bin/java" --batch-id "ci-${{ github.sha }}-${{ matrix.loader }}" "${scenario_args[@]}"

      - name: Preserve compact native reports and lossless screenshots
        if: always()
        run: |
          build/ci-tools/bin/python -B scripts/compact-ci-game-evidence.py             --loader "${{ matrix.loader }}" --batch-id "ci-${{ github.sha }}-${{ matrix.loader }}"

      - name: Retain useful client diagnostics and compressed evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: client-${{ matrix.loader }}-${{ github.sha }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            build/ci-verification/*.json
            build/ci-client-production/SHA256SUMS
            build/ci-runtime-receipt.json
            build/e2e/runtime/26.2/minecraft/.provision/*.json
            build/e2e/runtime/26.2/minecraft/.provision/*.log
            build/e2e/ci-client/${{ matrix.loader }}/ci-${{ github.sha }}-${{ matrix.loader }}/summary.json
            build/e2e/ci-client/${{ matrix.loader }}/ci-${{ github.sha }}-${{ matrix.loader }}/*.log
            build/e2e/ci-client/${{ matrix.loader }}/ci-${{ github.sha }}-${{ matrix.loader }}/logs/*.log
            build/e2e/ci-client-compact/${{ matrix.loader }}/ci-${{ github.sha }}-${{ matrix.loader }}/
