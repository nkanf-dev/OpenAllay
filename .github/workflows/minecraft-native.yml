name: Mature Forge native acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mature-forge-native-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    name: Forge 1.19.2 bundled product and actual native acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: |
            17
            21
            25
      - name: Reuse the original strictly verified Forge product
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          github-token: ${{ github.token }}
          run-id: 37380001204
          artifact-ids: 11372734283
          path: build/original-native-product
      - name: Verify and stage original bytes without recompilation
        run: python3 -B scripts/stage-original-forge-product.py
      - name: Install the isolated headless display and compact evidence tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libgl1-mesa-dri libglx-mesa0 libegl1 libegl-mesa0 libopenal1 webp
          python3 -m venv build/ci-tools
          build/ci-tools/bin/python -m pip install Pillow==11.3.0
      - name: Provision the normal official Forge client and verified assets
        run: |
          python3 -B scripts/prepare-ci-minecraft-runtime.py --loader forge --minecraft-target 1.19.2 --java "$JAVA_HOME_17_X64/bin/java" --minecraft-root "$PWD/build/e2e/runtime/1.19.2/minecraft" > build/ci-runtime-receipt.json
          python3 -B scripts/run-packaged-builder-acceptance.py --prepare-assets --minecraft-target 1.19.2 --minecraft-root "$PWD/build/e2e/runtime/1.19.2/minecraft" --assets-root "$PWD/build/e2e/runtime/1.19.2/assets"
      - name: Run actual Builder, original-world reload and changed native UI behavior
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
          OPENALLAY_E2E_SOURCE_REVISION: 9cb05cd1105ee93e4f69850154642f38354441e3
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24 +extension GLX +render -noreset" --error-file="$PWD/build/ci-xvfb.log"             python3 -B scripts/run-ci-game-workflow.py --loader forge --minecraft-target 1.19.2 --java "$JAVA_HOME_17_X64/bin/java" --batch-id forge1192-${{ github.run_id }} --scenarios builder-acceptance builder-reload ui-live-ux-regressions
      - name: Preserve bounded generated native command source facts
        if: always()
        run: python3 -B scripts/capture-forge-native-contracts.py
      - name: Compress evidence from actually prepared client phases
        if: ${{ always() && hashFiles('build/e2e/ci-client/forge/**/summary.json') != '' }}
        run: build/ci-tools/bin/python -B scripts/compact-ci-game-evidence.py --loader forge --batch-id forge1192-${{ github.run_id }}
      - name: Retain actual outcomes and compact native diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mature-forge-native-1.19.2-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/forge-native-contracts/
            forge/build/native-engine/receipt.json
            build/ci-runtime-receipt.json
            build/original-native-product-receipt.json
            build/ci-xvfb.log
            build/e2e/runtime/1.19.2/minecraft/.provision/*.json
            build/e2e/ci-client/forge/forge1192-${{ github.run_id }}/summary.json
            build/e2e/ci-client/forge/forge1192-${{ github.run_id }}/*.log
            build/e2e/ci-client-compact/forge/forge1192-${{ github.run_id }}/
            build/reports/problems/
            forge/build/reports/
