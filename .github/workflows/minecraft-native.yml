  component1122-pack:
    if: inputs.mode == 'component1122-pack' || inputs.mode == 'component1122-mixin-repair' || inputs.mode == 'component1122-native-refresh'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: {persist-credentials: false}
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with: {distribution: temurin, java-version: '21.0.10+7.0.LTS'}
      - name: Capture immutable component Gradle tool JDK21
        run: printf 'OPENALLAY_COMPONENT_JAVA21_HOME=%s\n' "$JAVA_HOME" >> "$GITHUB_ENV"
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with: {distribution: temurin, java-version: '17.0.18+8'}
      - name: Capture immutable application JDK17
        run: printf 'OPENALLAY_COMPONENT_JAVA17_HOME=%s\n' "$JAVA_HOME" >> "$GITHUB_ENV"
      - name: Pack provider-verified retained bytes and census genuine private Mixin
        env: {GH_TOKEN: '${{ github.token }}'}
        run: python3 -B ${{ inputs.mode == 'component1122-native-refresh' && 'scripts/refresh-forge1122-component-native.py' || inputs.mode == 'component1122-mixin-repair' && 'scripts/repair-forge1122-private-mixin.py' || 'scripts/run-forge1122-component.py' }}
