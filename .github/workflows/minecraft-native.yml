name: Minecraft native compatibility

on:
  push:
    branches:
      - "mc/**"
  pull_request:
    paths:
      - "common/**"
      - "fabric/**"
      - "neoforge/**"
      - "adapters/**"
      - "gradle/**"
      - "build-logic/**"
      - ".github/workflows/minecraft-native.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: minecraft-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    # First-round representatives of actual native API boundaries, not release artifacts.
    name: Native ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        target: ["1.20.6", "1.20.4", "1.20.1"]
    env:
      OPENALLAY_MINECRAFT_TARGET: ${{ matrix.target }}
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Read target Java pin
        id: target
        run: |
          java_version=$(python3 scripts/minecraft-target.py --target "$OPENALLAY_MINECRAFT_TARGET" --property java_version)
          printf 'java_version=%s\n' "$java_version" >> "$GITHUB_OUTPUT"

      - name: Set up target Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: ${{ steps.target.outputs.java_version }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-provider: basic
          cache-read-only: true

      - name: Validate target and artifact tooling
        run: |
          python3 -B -m unittest discover -s scripts -p 'test_minecraft_target*.py'
          python3 -B -m unittest discover -s scripts -p 'test_minecraft_artifacts.py'
          python3 -B -m unittest discover -s scripts -p 'test_native_target_package.py'

      - name: Compile and package both native loaders
        # Shared feature tests run once in Quality. No Builder support widening or game claim.
        run: ./gradlew --max-workers=2 -PminecraftTarget="$OPENALLAY_MINECRAFT_TARGET" -PbundleExtensions=false :fabric:assemble :neoforge:assemble

      - name: Verify native package engine identity and metadata
        run: python3 -B scripts/verify-native-target-package.py --target "$OPENALLAY_MINECRAFT_TARGET"
