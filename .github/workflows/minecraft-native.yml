name: Forge16 namespace tooling and new publication ABI
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        default: tooling
        options: [tooling, abi, engine, native, pack, boot, ui, world, persistence, builder, builder-call, builder-lifecycle, builder-presets, stock1122, census1122]
permissions:
  contents: read
concurrency:
  group: forge16165-focused-tooling-${{ github.ref }}-${{ inputs.mode }}
  cancel-in-progress: false
jobs:
  focused-tooling-publication:
    if: inputs.mode == 'tooling' || inputs.mode == 'abi'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: '21.0.10+7.0.LTS'
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: '17.0.18+8'
      - name: Resolve actual FG host; accept focused tooling; capture only new ABI
        run: python3 -B scripts/forge16165-engine-prerequisite/focused-tooling-acceptance.py --output "$PWD/build/forge16165-focused-tooling-report" ${{ inputs.mode == 'abi' && '--pending-bodies' || '' }}
      - name: Retain tiny text evidence, never game or library binaries
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: forge16165-focused-tooling-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: build/forge16165-focused-tooling-report/

  changed-engine:
    if: inputs.mode == 'engine'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: '21.0.10+7.0.LTS'
      - name: Rebuild changed engine only and test custody call chains
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/forge16165-engine-prerequisite/build-changed-engine.py
      - name: Retain new engine once
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: forge16165-effective-engine-${{ github.sha }}
          retention-days: 30
          if-no-files-found: warn
          path: build/forge36-shared/
      - name: Retain focused test and producer evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: forge16165-engine-evidence-${{ github.sha }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            native-builds/engine-only/engine-core/build/test-results/
            native-builds/engine-only/engine-core/build/reports/tests/
            native-builds/engine-only/engine-core/build/engine-source-inputs.json
            build/changed-engine/receipt.json

  native-product:
    if: inputs.mode == 'native'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with: {distribution: temurin, java-version: '21.0.10+7.0.LTS'}
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with: {distribution: temurin, java-version: '17.0.18+8'}
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92
        with:
          cache-provider: basic
          cache-read-only: false
      - name: Compile the real native source union once
        env: {GH_TOKEN: '${{ github.token }}'}
        run: python3 -B scripts/build-forge16165-native.py
      - name: Retain native compile and mapping evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: forge16165-native-${{ github.sha }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            native-builds/forge16165/build/native-tooling/
            native-builds/forge16165/build/namespace/
            native-builds/forge16165/build/native-metadata/
            native-builds/forge16165/build/native-ap/
            native-builds/forge16165/build/libs/
            build/forge16165-native-report/

  pack-product:
    if: inputs.mode == 'pack'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with: {distribution: temurin, java-version: '17.0.18+8'}
      - name: Pack retained native and engine bytes without build replay
        env: {GH_TOKEN: '${{ github.token }}'}
        run: python3 -B scripts/run-forge16165-pack-only.py
      - name: Retain product once
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: forge16165-product-${{ github.sha }}
          retention-days: 30
          if-no-files-found: warn
          path: build/forge16165-product/
      - name: Retain packaging evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: forge16165-pack-evidence-${{ github.sha }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            build/forge16165-pack-inputs/*.json
            build/forge16165-pack-inputs/postprocessed/*.json
            build/forge16165-pack-inputs/source/build/e2e/runtime/forge16165-stock/minecraft/.provision/*.json
            build/forge16165-pack-inputs/source/build/e2e/runtime/forge16165-stock/minecraft/.provision/*.log

  product-native-boot:
    if: inputs.mode == 'boot' || inputs.mode == 'ui' || inputs.mode == 'world' || inputs.mode == 'persistence' || inputs.mode == 'builder-call'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: {persist-credentials: false}
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with: {distribution: temurin, java-version: '17.0.18+8'}
      - name: Install isolated display and screenshot support
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libgl1-mesa-dri libglx-mesa0 libegl1 libegl-mesa0 libopenal1
          python3 -m venv build/acceptance-tools
          build/acceptance-tools/bin/python -m pip install Pillow==11.3.0
      - name: Boot the actual product once with required Mixin bindings
        env: {GH_TOKEN: '${{ github.token }}'}
        run: build/acceptance-tools/bin/python -B scripts/forge16165-product-native-acceptance.py ${{ inputs.mode == 'builder-call' && '--builder-call' || inputs.mode == 'ui' && '--ui' || inputs.mode == 'persistence' || inputs.mode == 'builder-call' && '--persistence' || inputs.mode == 'world' && '--world' || '' }}
      - name: Retain actual product/native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: forge16165-product-boot-${{ github.sha }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            build/e2e/forge16165-product/*.json
            build/e2e/forge16165-product/*.log
            build/e2e/forge16165-product/*.png
            build/e2e/forge16165-product/game/logs/
            build/e2e/forge16165-product/game/crash-reports/
            build/e2e/forge16165-product-ui/*.json
            build/e2e/forge16165-product-ui/*.log
            build/e2e/forge16165-product-ui/*.png
            build/e2e/forge16165-product-ui/screenshots/
            build/e2e/forge16165-product-ui/game/logs/
            build/e2e/forge16165-product-ui/game/crash-reports/

            build/e2e/forge16165-product-builder/*.json
            build/e2e/forge16165-product-builder/*.log
            build/e2e/forge16165-product-builder/*.png
            build/e2e/forge16165-product-builder/game/logs/
            build/e2e/forge16165-product-builder/game/crash-reports/
            build/e2e/forge16165-product-world/*.json
            build/e2e/forge16165-product-world/*.log
            build/e2e/forge16165-product-world/*.png
            build/e2e/forge16165-product-world/game/logs/
            build/e2e/forge16165-product-world/game/crash-reports/
            build/e2e/runtime/forge16165-stock/minecraft/.provision/*.log

  builder-candidate:
    if: inputs.mode == 'builder'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: {persist-credentials: false}
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with: {distribution: temurin, java-version: '21.0.10+7.0.LTS'}
      - name: Build only the changed Builder candidate declaration
        env: {GH_TOKEN: '${{ github.token }}'}
        run: python3 -B scripts/build-forge16165-builder-candidate.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: forge16165-builder-candidate-${{ github.sha }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            build/forge16165-builder-candidate/builder-candidate.jar
            build/forge16165-builder-candidate/builder-candidate.json

  builder-native-lifecycle:
    if: inputs.mode == 'builder-lifecycle'
    strategy:
      fail-fast: false
      matrix:
        scenario: [partial, cancel, undo]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: {persist-credentials: false}
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with: {distribution: temurin, java-version: '17.0.18+8'}
      - name: Install isolated display and screenshot support
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libgl1-mesa-dri libglx-mesa0 libegl1 libegl-mesa0 libopenal1
          python3 -m venv build/acceptance-tools
          build/acceptance-tools/bin/python -m pip install Pillow==11.3.0
      - name: Boot the actual product once with required Mixin bindings
        env: {GH_TOKEN: '${{ github.token }}'}
        run: build/acceptance-tools/bin/python -B scripts/forge16165-product-native-acceptance.py --builder-call --builder-scenario ${{ matrix.scenario }}
      - name: Retain actual product/native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: forge16165-builder-${{ matrix.scenario }}-${{ github.sha }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            build/e2e/forge16165-product/*.json
            build/e2e/forge16165-product/*.log
            build/e2e/forge16165-product/*.png
            build/e2e/forge16165-product/game/logs/
            build/e2e/forge16165-product/game/crash-reports/
            build/e2e/forge16165-product-ui/*.json
            build/e2e/forge16165-product-ui/*.log
            build/e2e/forge16165-product-ui/*.png
            build/e2e/forge16165-product-ui/screenshots/
            build/e2e/forge16165-product-ui/game/logs/
            build/e2e/forge16165-product-ui/game/crash-reports/

            build/e2e/forge16165-product-builder/*.json
            build/e2e/forge16165-product-builder/*.log
            build/e2e/forge16165-product-builder/*.png
            build/e2e/forge16165-product-builder/game/logs/
            build/e2e/forge16165-product-builder/game/crash-reports/
            build/e2e/forge16165-product-world/*.json
            build/e2e/forge16165-product-world/*.log
            build/e2e/forge16165-product-world/*.png
            build/e2e/forge16165-product-world/game/logs/
            build/e2e/forge16165-product-world/game/crash-reports/
            build/e2e/runtime/forge16165-stock/minecraft/.provision/*.log

  builder-native-presets:
    if: inputs.mode == 'builder-presets'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: {persist-credentials: false}
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with: {distribution: temurin, java-version: '17.0.18+8'}
      - name: Install isolated display and screenshot support
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libgl1-mesa-dri libglx-mesa0 libegl1 libegl-mesa0 libopenal1
          python3 -m venv build/acceptance-tools
          build/acceptance-tools/bin/python -m pip install Pillow==11.3.0
      - name: Boot the actual product once with required Mixin bindings
        env: {GH_TOKEN: '${{ github.token }}'}
        run: build/acceptance-tools/bin/python -B scripts/forge16165-product-native-acceptance.py --builder-call --builder-scenario acceptance --builder-reload --bundled-builder --product-inputs native-builds/forge16165/preset-product-inputs.json
      - name: Retain actual product/native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: forge16165-builder-presets-${{ github.sha }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            build/e2e/forge16165-product/*.json
            build/e2e/forge16165-product/*.log
            build/e2e/forge16165-product/*.png
            build/e2e/forge16165-product/game/logs/
            build/e2e/forge16165-product/game/crash-reports/
            build/e2e/forge16165-product-ui/*.json
            build/e2e/forge16165-product-ui/*.log
            build/e2e/forge16165-product-ui/*.png
            build/e2e/forge16165-product-ui/screenshots/
            build/e2e/forge16165-product-ui/game/logs/
            build/e2e/forge16165-product-ui/game/crash-reports/

            build/e2e/forge16165-product-builder/*.json
            build/e2e/forge16165-product-builder/*.log
            build/e2e/forge16165-product-builder/*.png
            build/e2e/forge16165-product-builder/game/logs/
            build/e2e/forge16165-product-builder/game/crash-reports/
            build/e2e/forge16165-product-world/*.json
            build/e2e/forge16165-product-world/*.log
            build/e2e/forge16165-product-world/*.png
            build/e2e/forge16165-product-world/game/logs/
            build/e2e/forge16165-product-world/game/crash-reports/
            build/e2e/runtime/forge16165-stock/minecraft/.provision/*.log

  stock1122-java17-prerequisite:
    if: inputs.mode == 'stock1122'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: {persist-credentials: false}
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with: {distribution: temurin, java-version: '17.0.18+8'}
      - name: Install isolated stock client display support
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libgl1-mesa-dri libglx-mesa0 libegl1 libegl-mesa0 libopenal1
          python3 -m venv build/stock1122-tools
          build/stock1122-tools/bin/python -m pip install Pillow==11.3.0
      - name: Provision official Forge14 and capture the first raw Java17 startup
        run: >-
          xvfb-run -a -s '-screen 0 1280x960x24'
          build/stock1122-tools/bin/python -B scripts/forge1122-runtime-prerequisite/stock-forge1122-prerequisite.py
          --repo "$PWD" --java "$JAVA_HOME/bin/java" --java-release '17.0.18+8'
          --minecraft-root "$PWD/build/e2e/runtime/forge1122-stock/minecraft"
          --output "$PWD/build/e2e/forge1122-stock"
      - name: Retain only stock startup and source evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: forge1122-stock-java17-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            build/e2e/forge1122-stock/*.json
            build/e2e/forge1122-stock/*.log
            build/e2e/forge1122-stock/*.png
            build/e2e/forge1122-stock/game/logs/
            build/e2e/forge1122-stock/game/crash-reports/
            build/e2e/runtime/forge1122-stock/minecraft/.provision/*.json
            build/e2e/runtime/forge1122-stock/minecraft/.provision/*.log

  native1122-census:
    if: inputs.mode == 'census1122'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: '17.0.18+8'
      - name: Preserve exact metadata JDK17 path
        run: echo "CENSUS_JAVAP=$JAVA_HOME/bin/javap" >> "$GITHUB_ENV"
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: '8.0.482+8'
      - name: Export one normal FG3 named input island; inventory only
        run: python3 -B scripts/run-forge1122-native-census.py --workspace "$RUNNER_TEMP/forge1122-tool" --output "$RUNNER_TEMP/forge1122-census" --javap "$CENSUS_JAVAP"
      - name: Retain bounded text evidence, not game binaries or caches
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: forge1122-native-census-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: ${{ runner.temp }}/forge1122-census/
