  component1122-boot:
    if: inputs.mode == 'component1122-boot' || inputs.mode == 'component1122-world-sdk' || inputs.mode == 'component1122-ui-manual' || inputs.mode == 'component1122-world-persistence' || startsWith(inputs.mode, 'component1122-builder-')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: {persist-credentials: false}
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with: {distribution: temurin, java-version: '8.0.482+8'}
      - name: Capture immutable build-only JDK8 converter
        run: printf 'OPENALLAY_PACK200_JAVA8_HOME=%s\n' "$JAVA_HOME" >> "$GITHUB_ENV"
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with: {distribution: temurin, java-version: '17.0.18+8'}
      - name: Capture immutable component runtime JDK17
        run: printf 'OPENALLAY_COMPONENT_JAVA17_HOME=%s\n' "$JAVA_HOME" >> "$GITHUB_ENV"
      - name: Install real isolated display utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth x11-xserver-utils libgl1-mesa-dri libglx-mesa0 libegl1 libegl-mesa0 libopenal1
          python3 -m venv build/stock1122-tools
          build/stock1122-tools/bin/python -m pip install Pillow==11.3.0
      - name: Boot retained actual component once; verify only new capability and loader boundaries
        env: {GH_TOKEN: '${{ github.token }}'}
        run: >-
          xvfb-run -a -s '-screen 0 1280x960x24'
          build/stock1122-tools/bin/python -B scripts/boot-forge1122-component.py
          --product-pin native-builds/forge1122-component/accepted-product-provider.json
          ${{ inputs.mode == 'component1122-builder-restricted' && '--builder-scenario restricted --applied-bindings' || inputs.mode == 'component1122-builder-partial' && '--builder-scenario partial --applied-bindings' || inputs.mode == 'component1122-builder-cancel' && '--builder-scenario cancel --applied-bindings' || inputs.mode == 'component1122-builder-undo' && '--builder-scenario undo --applied-bindings' || inputs.mode == 'component1122-world-persistence' && '--world-persistence --applied-bindings' || inputs.mode == 'component1122-ui-manual' && '--ui-manual --applied-bindings' || inputs.mode == 'component1122-world-sdk' && '--world-sdk --applied-bindings' || '' }}
      - name: Retain component startup proof and exact rejected inputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: forge1122-component-boot-${{ github.sha }}-${{ github.run_attempt }}
