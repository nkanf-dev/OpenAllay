name: Mature Forge native compilation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mature-forge-native-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    name: Forge 1.18.2 typed native compilation and primary toast contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: |
            17
            21
            25
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92
        with:
          cache-provider: basic
          cache-read-only: true
      - name: Compile one selected native closure and test the new editor state
        run: >-
          ./gradlew --max-workers=2 --stacktrace -PminecraftTarget=1.18.2 -PbundleExtensions=false
          :forge:assemble :forge:captureNativeCommandContracts :common:test
          --tests dev.openallay.client.gui.GuideMultilineTextStateTest
          -x :engine-core:test -x :runtime-maven:test
      - name: Retain existing named toast contracts after a compilation failure
        if: ${{ failure() }}
        continue-on-error: true
        run: ./gradlew --max-workers=2 -PminecraftTarget=1.18.2 -PbundleExtensions=false :forge:captureNativeCommandContracts
      - name: Preserve primary source-bound compilation outcomes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mature-forge-1.18.2-native-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            forge/build/libs/openallay-forge-1.18.2-0.4.2.jar
            build/forge-native-contracts/
            forge/build/native-engine/receipt.json
            common/build/test-results/test/
            common/build/reports/tests/test/
            build/reports/problems/
