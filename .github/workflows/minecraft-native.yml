name: Mature Forge backport
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mature-forge-first-anchor-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    name: Forge 1.19.2 native compilation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: |
            17
            21
            25
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92
        with:
          cache-provider: basic
          cache-read-only: true
      - name: Compile the selected native closure without repeating feature suites
        shell: bash
        run: ./gradlew --max-workers=2 --stacktrace -PminecraftTarget=1.19.2 -PbundleExtensions=false :forge:assemble
      - name: Retain exact native command source contracts
        if: always()
        run: python3 -B scripts/capture-forge-native-contracts.py
      - name: Retain compact source-bound build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mature-forge-1.19.2-compile-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            forge/build/libs/*.jar
            common/build/reports/problems/
            forge/build/reports/
            build/reports/problems/
            build/forge-native-contracts/
