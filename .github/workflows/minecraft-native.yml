name: Preserve accepted mature native products
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: preserve-mature-products-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preserve-originals:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Retrieve original building/reload/commands/UI
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          github-token: ${{ github.token }}
          run-id: 37388892087
          artifact-ids: 11380706080
          path: build/original-product-imports/11380706080
      - name: Retrieve original building/reload/commands
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          github-token: ${{ github.token }}
          run-id: 37397120987
          artifact-ids: 11383755758
          path: build/original-product-imports/11383755758
      - name: Retrieve original UI/editor/native-toasts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          github-token: ${{ github.token }}
          run-id: 37398771932
          artifact-ids: 11383699840
          path: build/original-product-imports/11383699840
      - name: Retrieve original affected modern UI with correction receipt
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          github-token: ${{ github.token }}
          run-id: 37401212610
          artifact-ids: 11384878871
          path: build/original-product-imports/11384878871
      - name: Check exact accepted hashes and preserve original provenance
        run: python3 -B scripts/preserve-accepted-mature-products.py
      - name: Retain original products without a rebuild or release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: accepted-mature-native-products-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: error
          path: build/preserved-mature-products/
