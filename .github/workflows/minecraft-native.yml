name: Forge36 native source declaration inventory
on:
  workflow_dispatch:
    inputs:
      inventory:
        description: Native declaration selection
        required: true
        default: primary
        type: choice
        options:
          - primary
          - supplement
permissions:
  contents: read
concurrency:
  group: forge36-native-api-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-api:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: '17.0.18+8'
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92
        with:
          cache-provider: basic
          cache-read-only: true
      - name: Resolve genuine native API and export selected declarations only
        env:
          JAVA_HOME_17_X64: ${{ env.JAVA_HOME }}
        run: python3 -B scripts/forge16165-engine-prerequisite/export-native-api.py ${{ inputs.inventory == 'supplement' && '--supplement' || '' }}
      - name: Keep small public-access and method-body source evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: forge36-native-api-${{ github.sha }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            build/forge36-native-api/*.json
            build/forge36-native-api/*.txt
