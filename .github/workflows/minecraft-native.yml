name: Build release packages
on:
  workflow_dispatch:
    inputs:
      native_language_candidates:
        type: boolean
        default: false
        description: One actual normalized native source var-pattern-switch-API cohort candidate
      native_record_candidates:
        type: boolean
        default: false
        description: Parse exact selected native source record candidates only, no Forge build
      native_java8_diagnostic:
        type: boolean
        default: false
        description: Compile the exact Forge1.12.2 selected native source Java8 frontier only
      metadata_only:
        type: boolean
        default: false
        description: Read original successful group metadata without compiling
permissions:
  contents: read
concurrency:
  group: release-packages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  plan:
    if: ${{ !inputs.metadata_only && !inputs.native_java8_diagnostic && !inputs.native_record_candidates && !inputs.native_language_candidates }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      groups: ${{ steps.groups.outputs.groups }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - id: groups
        run: python3 -B scripts/build-minecraft-artifacts.py groups --github-output "$GITHUB_OUTPUT"
  build-packages:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include: ${{ fromJson(needs.plan.outputs.groups) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: |
            17
            21
            25
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92
        with:
          cache-provider: basic
          cache-read-only: true
      - name: Prepare exact bundled Extension source
        run: python3 -B scripts/prepare-distribution.py
      - name: Compile and package selected native group
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_FAMILIES: ${{ matrix.families }}
        run: python3 -B scripts/build-minecraft-artifacts.py build-and-stage release-group --target "$RELEASE_TARGET" --families "$RELEASE_FAMILIES"
      - name: Preserve new packages and source-bound package receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-packages-${{ matrix.target }}-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: release-group/
      - name: Preserve small package metadata separately
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-metadata-${{ matrix.target }}-${{ github.sha }}
          retention-days: 30
          if-no-files-found: ignore
          path: |
            release-group/build-receipts/
            release-group/SHA256SUMS
      - name: Preserve compiler diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-build-diagnostics-${{ matrix.target }}-${{ github.sha }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/release-build-logs/
            build/reports/problems/
  stage:
    permissions:
      contents: read
      actions: read
    needs: build-packages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          pattern: release-packages-*
          path: build/release-groups
      - name: Retrieve unchanged packages from successful original groups
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/fetch-release-build-groups.py --output build/release-groups
      - name: Bind all current packages to compile-package evidence
        run: python3 -B scripts/build-minecraft-artifacts.py merge-staged build/release-groups release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-staged-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: release/
  collect-metadata:
    if: ${{ inputs.metadata_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          github-token: ${{ github.token }}
          run-id: 37419529652
          pattern: release-packages-*
          path: build/metadata-groups
      - name: Extract only successful original receipt records
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/collect-release-group-metadata.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-small-metadata-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: build/release-metadata/

  forge1122-java8-source-diagnostic:
    if: ${{ inputs.native_java8_diagnostic }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: {persist-credentials: false}
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with: {distribution: temurin, java-version: '17.0.18+8'}
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with: {distribution: temurin, java-version: '8.0.482+8'}
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92
        with: {cache-provider: basic, cache-read-only: false}
      - name: One exact native Java8 source/API diagnostic; no game or packaging
        env: {GH_TOKEN: '${{ github.token }}'}
        run: python3 -B scripts/diagnose-forge1122-native-java8.py
      - name: Keep complete native compiler/source/classpath diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: forge1122-java8-source-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            build/forge1122-java8-diagnostic/
            ${{ runner.temp }}/forge1122-java8-tooling/*.json
            ${{ runner.temp }}/forge1122-java8-tooling/*.log
            ${{ runner.temp }}/forge1122-java8-native/namespace-receipt.json
            ${{ runner.temp }}/forge1122-java8-native/java8-diagnostic/*.json
            ${{ runner.temp }}/forge1122-java8-native/java8-diagnostic/*.log

  forge1122-native-record-source-candidates:
    if: ${{ inputs.native_record_candidates }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: {persist-credentials: false}
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with: {distribution: temurin, java-version: '17.0.18+8'}
      - name: One parse-only exact native record source candidate packet
        run: python3 -B scripts/materialize-native-record-language.py --project "$PWD" --javac "$JAVA_HOME/bin/javac" --java "$JAVA_HOME/bin/java" --output "$RUNNER_TEMP/native-record-candidate"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-record-candidate-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: ${{ runner.temp }}/native-record-candidate/

  forge1122-native-language-source-candidates:
    if: ${{ inputs.native_language_candidates }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: {persist-credentials: false}
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with: {distribution: temurin, java-version: '17.0.18+8'}
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with: {distribution: temurin, java-version: '8.0.482+8'}
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92
        with: {cache-provider: basic, cache-read-only: false}
      - name: One real normalized whole native source language cohort candidate
        env: {GH_TOKEN: '${{ github.token }}'}
        run: python3 -B scripts/diagnose-forge1122-native-java8.py --language-candidates
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-language-candidate-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            build/forge1122-java8-diagnostic/
            ${{ runner.temp }}/forge1122-java8-tooling/*.json
            ${{ runner.temp }}/forge1122-java8-tooling/*.log
            ${{ runner.temp }}/forge1122-java8-native/namespace-receipt.json
            ${{ runner.temp }}/forge1122-java8-native/units.tsv
            ${{ runner.temp }}/forge1122-java8-native-language-candidate/
