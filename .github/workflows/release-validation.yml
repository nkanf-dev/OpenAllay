name: Release affected verification
on:
  workflow_dispatch:
    inputs:
      scope:
        type: choice
        options: [skills, modern, shared-fixtures, json-java8, primitives-java8, values-java8, rhino-leaves-java8, commonmark-java8, http-java8, record-converter, host-values, http-incomplete, query-values, full-query-java8, rhino-values, voice-http-java8, semantic-integration, rhino-carriers, context-java8, voice-consumers, tool-result-java8, engine-json-java8]
        default: skills
        required: true
permissions:
  contents: read
concurrency:
  group: release-affected-${{ github.ref }}-${{ inputs.scope }}
  cancel-in-progress: false
jobs:
  skills-runtime:
    if: inputs.scope == 'skills'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92
        with:
          cache-provider: basic
          cache-read-only: true
      - name: Test current-runtime Skill catalog and installer
        run: ./gradlew --max-workers=2 --stacktrace :engine-core:test --tests dev.openallay.settings.skill.SkillSettingsBackendTest --tests dev.openallay.skill.install.SkillPackageInstallerTest --tests dev.openallay.community.CommunityCatalogCodecTest
      - name: Retain focused test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-skill-runtime-${{ github.sha }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            engine-core/build/test-results/
            engine-core/build/reports/tests/
            build/reports/problems/

  shared-and-modern:
    if: inputs.scope == 'modern'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92
        with:
          cache-provider: basic
          cache-read-only: true
      - name: Prepare the accepted universal Builder source
        run: python3 -B scripts/prepare-distribution.py
      - name: Verify shared code and representative modern loader builds
        run: ./gradlew --max-workers=2 --stacktrace -PminecraftTarget=26.2 :extension-api:test :common:test :fabric:build :neoforge:build
      - name: Retain original shared and loader verification diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-shared-modern-${{ github.sha }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            extension-api/build/test-results/
            engine-core/build/test-results/
            runtime-json/build/test-results/
            runtime-maven/build/test-results/
            common/build/test-results/
            adapters/minecraft/build/test-results/
            fabric/build/test-results/
            neoforge/build/test-results/
            build/reports/problems/

  shared-fixtures:
    if: inputs.scope == 'shared-fixtures'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92
        with:
          cache-provider: basic
          cache-read-only: true
      - name: Verify only the failed shared fixture classes
        run: ./gradlew --max-workers=2 --stacktrace :engine-core:test --tests dev.openallay.bridge.server.ServerBridgeArchitectureTest --tests dev.openallay.guide.semantic.SemanticDependencyPackagingTest --tests dev.openallay.server.ServerAgentImageServiceTest
      - name: Retain original focused fixture results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-shared-fixtures-${{ github.sha }}
          retention-days: 30
          if-no-files-found: warn
          path: engine-core/build/test-results/

  json-java8:
    if: inputs.scope == 'json-java8'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: |
            8
            17
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92
        with:
          cache-provider: basic
          cache-read-only: true
      - name: Verify canonical JSON behavior on Java 8 and Gson 2.8.0
        run: ./gradlew -p runtime-json/src/java8Test/gradle --no-daemon -Dorg.gradle.java.installations.paths="$JAVA_HOME_8_X64,$JAVA_HOME_17_X64" :runtime-json:java8CompatibilityTest :runtime-json:jar -PjsonVerificationGsonVersion=2.8.0
      - name: Verify the same classes on Java 8 and current Gson
        run: ./gradlew -p runtime-json/src/java8Test/gradle --no-daemon -Dorg.gradle.java.installations.paths="$JAVA_HOME_8_X64,$JAVA_HOME_17_X64" :runtime-json:java8CompatibilityTest -PjsonVerificationGsonVersion=2.13.2
      - name: Retain canonical Java 8 JSON artifact and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: java8-runtime-json-${{ github.sha }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            runtime-json/build/libs/
            runtime-json/build/classes/
            runtime-json/build/reports/

  primitives-java8:
    if: inputs.scope == 'primitives-java8'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: |
            8
            21
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92
        with:
          cache-provider: basic
          cache-read-only: true
      - name: Verify canonical primitives and actual semantic IDs on Java 8
        run: ./gradlew --no-daemon -p engine-core/src/java8Test/primitives -Dorg.gradle.java.installations.auto-detect=false -Dorg.gradle.java.installations.auto-download=false -Dorg.gradle.java.installations.paths="$JAVA_HOME_8_X64,$JAVA_HOME_21_X64" modernOracleTest java8CompatibilityTest
      - name: Retain Java 8 primitive fixture classes and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: java8-primitives-${{ github.sha }}
          retention-days: 30
          if-no-files-found: warn
          path: engine-core/src/java8Test/primitives/build/

  values-java8:
    if: inputs.scope == 'values-java8'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: |
            8
            17
            25
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92
        with:
          cache-provider: basic
          cache-read-only: true
      - name: Verify the canonical value adapter on genuine Java 8 with Gson 2.8.0
        run: ./gradlew -p engine-core/src/java8Test/gradle --no-daemon -Dorg.gradle.java.installations.paths="$JAVA_HOME_8_X64,$JAVA_HOME_17_X64" java8ValueSchemaTest -PjsonVerificationGsonVersion=2.8.0
      - name: Verify the same canonical value adapter on genuine Java 8 with current Gson
        run: ./gradlew -p engine-core/src/java8Test/gradle --no-daemon -Dorg.gradle.java.installations.paths="$JAVA_HOME_8_X64,$JAVA_HOME_17_X64" java8ValueSchemaTest -PjsonVerificationGsonVersion=2.13.2
      - name: Verify actual engine JSON and strict Tool consumers
        run: ./gradlew --max-workers=2 :engine-core:test --tests dev.openallay.json.ExplicitValueSchemaTest --tests dev.openallay.json.RecordJsonAdapterTest --tests dev.openallay.json.EngineJsonOwnerTest --tests dev.openallay.json.EngineJsonHierarchyTest --tests dev.openallay.agent.tool.ToolSchemaGeneratorTest
      - name: Retain original value schema and consumer test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: java8-values-${{ github.sha }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            engine-core/src/java8Test/gradle/build/
            engine-core/build/test-results/

  rhino-leaves-java8:
    if: inputs.scope == 'rhino-leaves-java8'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: |
            8
            17
      - name: Fetch exact authentic Rhino sources and compile-only annotations
        run: |
          mkdir -p build/rhino-java8-inputs
          curl --fail --location https://maven.latvian.dev/releases/dev/latvian/mods/rhino/2101.2.8-build.91/rhino-2101.2.8-build.91-sources.jar --output build/rhino-java8-inputs/rhino-sources.jar
          curl --fail --location https://repo.maven.apache.org/maven2/org/jetbrains/annotations/24.1.0/annotations-24.1.0.jar --output build/rhino-java8-inputs/annotations.jar
          printf '%s  %s\n' bc5b779005b68ce8d00f775aae2b44db82d0c8636264a1d26955c486ee0fe8b8 build/rhino-java8-inputs/rhino-sources.jar 27a770dc7ce50500918bb8c3c0660c98290630ec796b5e3cf6b90f403b3033c6 build/rhino-java8-inputs/annotations.jar | sha256sum --check
      - name: Verify exact canonical source preparation
        run: RHINO_SOURCE_ARCHIVE="$PWD/build/rhino-java8-inputs/rhino-sources.jar" python3 -B -m unittest discover -s scripts -p test_prepare_rhino_sources.py -v
      - name: Compile and execute genuine canonical Rhino leaves on Java 8
        run: python3 -B scripts/verify-rhino-java8-leaves.py build/rhino-java8-inputs/rhino-sources.jar --javac "$JAVA_HOME_17_X64/bin/javac" --java8 "$JAVA_HOME_8_X64/bin/java" --annotations build/rhino-java8-inputs/annotations.jar --output build/rhino-java8-leaf-proof
      - name: Retain exact Rhino leaf proof without claiming full runtime acceptance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: java8-rhino-leaves-${{ github.sha }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            build/rhino-java8-leaf-proof/receipt.json
            build/rhino-java8-leaf-proof/classes/

  commonmark-java8:
    if: inputs.scope == 'commonmark-java8'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: |
            8
            17
            21
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92
        with:
          cache-provider: basic
          cache-read-only: true
      - name: Compile and verify the full canonical parser runtime on Java 8
        run: ./gradlew --no-daemon -p runtime-commonmark -Dorg.gradle.java.installations.paths="$JAVA_HOME_8_X64,$JAVA_HOME_17_X64,$JAVA_HOME_21_X64" java8Proof -PcommonmarkJava8Executable="$JAVA_HOME_8_X64/bin/java"
      - name: Verify generated source output ownership guards
        run: >-
          python3 -B runtime-commonmark/src/java8Test/ProvenanceGuards.py --source-root "$PWD"
          --source-core "$(find "$HOME/.gradle/caches/modules-2/files-2.1/org.commonmark/commonmark/0.28.0" -name '*-sources.jar' -print -quit)"
          --source-tables "$(find "$HOME/.gradle/caches/modules-2/files-2.1/org.commonmark/commonmark-ext-gfm-tables/0.28.0" -name '*-sources.jar' -print -quit)"
      - name: Retain full parser API and golden behavior evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: java8-commonmark-${{ github.sha }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            runtime-commonmark/build/java8-proof/
            runtime-commonmark/build/libs/
            runtime-commonmark/build/reports/

  http-java8:
    if: inputs.scope == 'http-java8'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: |
            8
            21
            25
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92
        with:
          cache-provider: basic
          cache-read-only: true
      - name: Verify actual Java 8 sockets, streaming, blocked POST and cancellation cleanup
        run: ./gradlew --no-daemon -p engine-core/src/java8Test/http -Dorg.gradle.java.installations.auto-detect=false -Dorg.gradle.java.installations.auto-download=false -Dorg.gradle.java.installations.paths="$JAVA_HOME_8_X64,$JAVA_HOME_21_X64" java8CompatibilityTest
      - name: Verify actual shared transport and model consumer contracts
        run: ./gradlew --max-workers=2 --no-daemon :engine-core:test --tests dev.openallay.net.JdkHttpTransportTest --tests dev.openallay.model.catalog.ProviderModelCatalogClientTest --tests dev.openallay.model.http.ModelTransportDiagnosticsTest --tests dev.openallay.model.scheduling.ModelUpstreamRecoveryHttpTest
      - name: Retain transport result and blocked-owner diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: java8-http-${{ github.sha }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            engine-core/src/java8Test/http/build/
            engine-core/build/test-results/

  record-converter:
    if: inputs.scope == 'record-converter'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: {persist-credentials: false}
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: |
            8
            21
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92
        with: {cache-provider: basic, cache-read-only: true}
      - name: Compare original records with genuine Java 8 values and emit review-only candidates
        run: ./gradlew --no-daemon -p build-logic/src/recordConversionTest/gradle -Dorg.gradle.java.installations.paths="$JAVA_HOME_8_X64,$JAVA_HOME_21_X64" recordConversionTest convertCanonicalQuery
      - name: Retain actual conversion receipts and oracle results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: java8-record-converter-${{ github.sha }}
          retention-days: 30
          if-no-files-found: warn
          path: build-logic/src/recordConversionTest/gradle/build/

  host-values:
    if: inputs.scope == 'host-values'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: {persist-credentials: false}
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: |
            8
            25
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92
        with: {cache-provider: basic, cache-read-only: true}
      - name: Compile and execute the typed metadata subset on genuine Java 8
        run: |
          mkdir -p build/java8-host-metadata
          "$JAVA_HOME_8_X64/bin/javac" -source 8 -target 8 -d build/java8-host-metadata engine-core/src/main/java/dev/openallay/value/ValueSchema.java engine-core/src/main/java/dev/openallay/value/ValueSchemas.java engine-core/src/main/java/dev/openallay/value/ValueType.java engine-core/src/main/java/dev/openallay/agent/tool/ToolDescription.java engine-core/src/main/java/dev/openallay/agent/tool/ToolOptional.java engine-core/src/test/java/dev/openallay/script/fixture/ExplicitHostValue.java
          "$JAVA_HOME_8_X64/bin/java" -cp build/java8-host-metadata dev.openallay.script.fixture.ExplicitHostValue
      - name: Verify actual closed Rhino host and schema consumers
        run: ./gradlew --max-workers=2 :engine-core:test --tests dev.openallay.script.host.RhinoHostAdapterTest --tests dev.openallay.script.host.ExplicitHostValueTest --tests dev.openallay.script.schema.HostSchemaCatalogTest --tests dev.openallay.script.schema.ExplicitHostSchemaTest --tests dev.openallay.architecture.DirectRhinoHostArchitectureTest
      - name: Retain original typed metadata and script results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: java8-host-values-${{ github.sha }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            build/java8-host-metadata/
            engine-core/build/test-results/

  http-incomplete:
    if: inputs.scope == 'http-incomplete'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: {persist-credentials: false}
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: |
            8
            21
            25
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92
        with: {cache-provider: basic, cache-read-only: true}
      - name: Verify only actual Java 8 incomplete response framing cases
        run: ./gradlew --no-daemon -p engine-core/src/java8Test/http -Dorg.gradle.java.installations.paths="$JAVA_HOME_8_X64,$JAVA_HOME_21_X64" java8CompatibilityTest --args="--case incomplete-response"
      - name: Recheck only the original failed model rejection case
        run: ./gradlew --max-workers=2 :engine-core:test --tests 'dev.openallay.model.scheduling.ModelUpstreamRecoveryHttpTest.rejected400WithAnIncompleteErrorBodyDoesNotBecomeATransportRetry'
      - name: Retain original selected regression evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: java8-http-incomplete-${{ github.sha }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            engine-core/src/java8Test/http/build/
            engine-core/build/test-results/
  query-values:
    if: inputs.scope == 'query-values'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: {persist-credentials: false}
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with: {distribution: temurin, java-version: '25'}
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92
        with: {cache-provider: basic, cache-read-only: true}
      - name: Verify canonical registry value consumers and closed script results
        run: ./gradlew --max-workers=2 :engine-core:test --tests dev.openallay.script.JavascriptTypedResultTest --tests dev.openallay.script.data.MinecraftAgentHostGraphTest --tests dev.openallay.script.host.ExplicitHostValueTest --tests dev.openallay.script.schema.ExplicitHostSchemaTest --tests dev.openallay.json.ExplicitValueSchemaTest
      - name: Retain canonical value consumer test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: java8-query-values-${{ github.sha }}
          retention-days: 30
          if-no-files-found: warn
          path: engine-core/build/test-results/

  full-query-java8:
    if: inputs.scope == 'full-query-java8'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: |
            8
            21
            25
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92
        with: {cache-provider: basic, cache-read-only: true}
      - name: Preserve exact original canonical owner input for the behavior oracle
