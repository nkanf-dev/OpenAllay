name: Modrinth moderation read-only audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read authorized moderation state without exporting credentials
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          AUDIT_OUTPUT: ${{ runner.temp }}/moderation-audit.json
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import json,os,pathlib,time,urllib.request,urllib.error
          API='https://api.modrinth.com/v2';PROJECT='vuB8HitN';token=os.environ['MODRINTH_TOKEN'];record={'kind':'authorized-readonly-moderation-audit','generatedAtUnix':time.time(),'projectId':PROJECT,'requests':{},'tokenIncluded':False,'mutationsPerformed':False}
          def get(label,path):
           req=urllib.request.Request(API+path,headers={'Authorization':token,'User-Agent':'nkanf-dev/OpenAllay moderation audit (https://github.com/nkanf-dev/OpenAllay)'})
           try:
            with urllib.request.urlopen(req,timeout=30) as response:status=response.status;raw=response.read(4*1024*1024+1)
            assert len(raw)<=4*1024*1024
            data=json.loads(raw);record['requests'][label]={'path':path,'http':status,'data':data};print('read_only_endpoint='+label+' http='+str(status),flush=True);return data
           except urllib.error.HTTPError as error:
            record['requests'][label]={'path':path,'http':error.code};print('read_only_endpoint='+label+' http='+str(error.code),flush=True)
           except Exception as error:
            record['requests'][label]={'path':path,'errorClass':type(error).__name__};print('read_only_endpoint='+label+' errorClass='+type(error).__name__,flush=True)
           return None
          user=get('self','/user');project=get('project','/project/'+PROJECT);versions=get('versions','/project/'+PROJECT+'/version')
          if isinstance(project,dict) and project.get('thread_id'):get('moderationThread','/thread/'+str(project['thread_id']))
          if isinstance(user,dict) and user.get('id'):get('notifications','/user/'+str(user['id'])+'/notifications')
          pathlib.Path(os.environ['AUDIT_OUTPUT']).write_text(json.dumps(record,ensure_ascii=False,indent=2))
          print('audit_complete token_exported=false writes=false',flush=True)
          PY
      - name: Encrypt private audit to the local owner key
        run: |
          set -euo pipefail
          umask 077
