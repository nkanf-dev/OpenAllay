          openssl cms -encrypt -binary -aes256 \
            -in "${{ runner.temp }}/moderation-audit.json" \
            -out "${{ runner.temp }}/moderation-audit.encrypted" -outform DER \
            "${{ runner.temp }}/audit-public-cert.pem"
          rm -f "${{ runner.temp }}/moderation-audit.json"
      - name: Preserve only encrypted audit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: encrypted-moderation-audit
          path: ${{ runner.temp }}/moderation-audit.encrypted
          retention-days: 1
          if-no-files-found: error
