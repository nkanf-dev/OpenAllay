import java.security.MessageDigest
plugins { id 'java' }
def repo = file('../../../..')
def toolJdk = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(21) }
def modern = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
def java8 = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(8) }
def sourceRoot = new File(repo, 'build-logic/src/recordConversionTest')
def output = layout.buildDirectory.dir('converted-fixture')
def selected = 'RecordFixtureValues.Empty,RecordFixtureValues.Numbers,RecordFixtureValues.Normalized,RecordFixtureValues.Generic,RecordFixtureValues.OverrideValue,RecordFixtureValues.Custom'
def sha = { File file -> MessageDigest.getInstance('SHA-256').digest(file.bytes).encodeHex().toString() }
sourceSets.main.java.setSrcDirs([new File(repo, 'build-logic/src/main/java'), new File(sourceRoot, 'tool')])
sourceSets.main.java.setIncludes(['dev/openallay/build/RecordValueSourceConverter.java', 'dev/openallay/build/RecordConversionNegativeFixture.java'])
tasks.named('compileJava', JavaCompile) { javaCompiler = toolJdk; options.release = 17 }
tasks.register('negativeForms', JavaExec) {
    dependsOn('classes'); mainClass = 'dev.openallay.build.RecordConversionNegativeFixture'
    classpath = sourceSets.main.runtimeClasspath; javaLauncher = modern
}
tasks.register('convertFixture', JavaExec) {
    dependsOn('classes', 'negativeForms')
    mainClass = 'dev.openallay.build.RecordValueSourceConverter'
    classpath = sourceSets.main.runtimeClasspath; javaLauncher = modern
    def request = layout.buildDirectory.file('fixture-request.tsv')
    doFirst {
        def input = new File(sourceRoot, 'inputs/dev/openallay/json/RecordFixtureValues.java')
        def directory = output.get().asFile
        if (directory.exists()) throw new GradleException('Fresh conversion output required; preserve the previous receipt')
        request.get().asFile.parentFile.mkdirs()
        request.get().asFile.text = [input.absolutePath, 'dev/openallay/json/RecordFixtureValues.java', sha(input), selected].join('\t') + '\n'
        args(request.get().asFile.absolutePath, directory.absolutePath)
    }
}
def support = [new File(repo, 'engine-core/src/main/java/dev/openallay/value/ValueType.java'),
        new File(repo, 'engine-core/src/main/java/dev/openallay/value/ValueSchema.java'),
        new File(repo, 'engine-core/src/main/java/dev/openallay/value/ValueSchemas.java', 'engine-core/src/main/java/dev/openallay/value/RecordMetadata.java'),
        new File(repo, 'engine-core/src/main/java/dev/openallay/util/Java8Collections.java'),
        new File(repo, 'engine-core/src/main/java/dev/openallay/agent/tool/ToolDescription.java'),
        new File(repo, 'engine-core/src/main/java/dev/openallay/agent/tool/ToolOptional.java')]
def reporter = new File(sourceRoot, 'reporter/dev/openallay/json/RecordConversionReport.java')
tasks.register('compileOriginal', JavaCompile) {
    source = files(support, reporter, new File(sourceRoot, 'inputs/dev/openallay/json/RecordFixtureValues.java'))
    classpath = files(); destinationDirectory = layout.buildDirectory.dir('original-classes')
    javaCompiler = toolJdk; options.release = 17; options.encoding = 'UTF-8'
}
tasks.register('compileConverted', JavaCompile) {
    dependsOn('convertFixture')
    source = files(support, reporter, output.map { new File(it.asFile, 'candidate/dev/openallay/json/RecordFixtureValues.java') })
    classpath = files(); destinationDirectory = layout.buildDirectory.dir('converted-classes')
    javaCompiler = toolJdk; options.release = 8; options.encoding = 'UTF-8'
}
tasks.register('originalOracle', JavaExec) {
    dependsOn('compileOriginal'); javaLauncher = modern
    mainClass = 'dev.openallay.json.RecordConversionReport'
    classpath = files(tasks.named('compileOriginal').flatMap { it.destinationDirectory })
    doFirst { standardOutput = new ByteArrayOutputStream() }
    doLast { layout.buildDirectory.file('original-report.txt').get().asFile.bytes = standardOutput.toByteArray() }
}
tasks.register('convertedOracle', JavaExec) {
    dependsOn('compileConverted'); javaLauncher = java8
    mainClass = 'dev.openallay.json.RecordConversionReport'; args('converted')
    classpath = files(tasks.named('compileConverted').flatMap { it.destinationDirectory })
    doFirst { standardOutput = new ByteArrayOutputStream() }
    doLast { layout.buildDirectory.file('converted-report.txt').get().asFile.bytes = standardOutput.toByteArray() }
}
tasks.register('recordConversionTest') {
    dependsOn('originalOracle', 'convertedOracle')
    doLast {
        def before = layout.buildDirectory.file('original-report.txt').get().asFile
        def after = layout.buildDirectory.file('converted-report.txt').get().asFile
        if (!java.util.Arrays.equals(before.bytes, after.bytes)) throw new GradleException('Modern record vs genuineJava8 value behavior differs')
        logger.lifecycle('PASS modern record oracle equals genuineJava8 converted values')
        logger.lifecycle(after.getText('UTF-8'))
    }
}
// Review-only current canonical query-domain record output. No source is changed.
tasks.register('convertCanonicalQuery', JavaExec) {
    dependsOn('classes'); javaLauncher = modern
    mainClass = 'dev.openallay.build.RecordValueSourceConverter'; classpath = sourceSets.main.runtimeClasspath
    doFirst {
        def request = layout.buildDirectory.file('canonical-query-request.tsv').get().asFile
        request.parentFile.mkdirs()
        def owners = [
            'engine-core/src/main/java/dev/openallay/tool/query/RegistryQueryEngine.java':'RegistryQueryEngine.Stage,RegistryQueryEngine.Field,RegistryQueryEngine.Schema,RegistryQueryEngine.Result',
            'engine-core/src/main/java/dev/openallay/context/RegistryEntrySnapshot.java':'RegistryEntrySnapshot',
            'engine-core/src/main/java/dev/openallay/context/RegistrySnapshot.java':'RegistrySnapshot']
        request.text = owners.collect { path, names -> def file = new File(repo, path)
            [file.absolutePath, path, sha(file), names].join('\t') }.join('\n') + '\n'
        args(request.absolutePath, layout.buildDirectory.dir('canonical-query-candidate').get().asFile.absolutePath)
    }
}
