import groovy.json.JsonSlurper

plugins {
    id 'java-library'
    id 'maven-publish'
}

// Ordinary exact-target builds never become a wider advertised binary family.
// Accepted interval naming is a deliberate opt-in with the same buildTarget.
def selectedArtifacts = [:]
def artifactSelection = providers.gradleProperty('minecraftArtifact')
def candidateSelection = providers.gradleProperty('minecraftCandidateArtifact')
if (artifactSelection.isPresent() && candidateSelection.isPresent()) {
    throw new GradleException('Accepted and validation-only candidate selections cannot compete')
}
if (artifactSelection.isPresent() || candidateSelection.isPresent()) {
    def selection = providers.exec {
        commandLine 'python3', rootProject.file(candidateSelection.isPresent()
                ? 'scripts/verify-minecraft-binary-intervals.py' : 'scripts/build-minecraft-artifacts.py'),
                'select', '--target', minecraftTarget, '--families',
                candidateSelection.isPresent() ? candidateSelection.get() : artifactSelection.get(),
                '--version', project.version.toString()
    }
    selection.result.get().assertNormalExitValue()
    selectedArtifacts = new JsonSlurper().parseText(selection.standardOutput.asText.get())
}
def selectedArtifact = selectedArtifacts[project.name]
def minecraftPredicate = selectedArtifact != null ? selectedArtifact.fabricMinecraftPredicate : minecraft_version
def minecraftRange = selectedArtifact != null ? selectedArtifact.minecraftMavenRange : "[${minecraft_version}]"

base {
    archivesName = selectedArtifact != null
            ? selectedArtifact.filenameTemplate.replace('-{version}.jar', '')
            : "${mod_id}-${project.name}-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(Jar).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_name}" }
    }
}

jar {

    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : project.jar.archiveVersion,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : minecraft_version
        ])
    }
}

processResources {
    var expandProps = [
            'version'                      : version,
            'group'                        : project.group, //Else we target the task's group.
            'minecraft_version'            : minecraft_version,
            'minecraft_version_range'      : minecraftRange,
            'mod_name'                     : mod_name,
            'mod_author'                   : mod_author,
            'mod_id'                       : mod_id,
            'license'                      : license,
            'description'                  : project.description,
            'credits'                      : credits,
            'java_version'                 : java_version
    ]

    // Expand only real selected external fields; Forge profiles have no Fabric/NeoForge pins.
    ['fabric_version', 'fabric_loader_version', 'neoforge_version',
     'neoforge_loader_version_range', 'forge_version', 'forge_loader_version_range'].each { key ->
        if (minecraftTargetProfile.containsKey(key)) expandProps[key] = minecraftTargetProfile[key]
    }

    if (minecraftTargetProfile.containsKey('forge_version')) {
        expandProps.forge_native_version = minecraftTargetProfile.forge_version
                .substring(minecraft_version.length() + 1)
    }

    var jsonExpandProps = expandProps.collectEntries {
        key, value -> [(key): value instanceof String ? value.replace('\n', '\\\\n') : value]
    }

    filesMatching(['META-INF/mods.toml', 'META-INF/neoforge.mods.toml']) {
        expand expandProps
    }

    filesMatching(['pack.mcmeta', 'fabric.mod.json', '*.mixins.json']) {
        expand jsonExpandProps
        if (name == 'fabric.mod.json') {
            // Target resource overlays use the same template. Do not edit every overlay.
            filter { line -> line.replace('"minecraft": "~' + minecraft_version + '"',
                    '"minecraft": "' + minecraftPredicate + '"') }
        }
    }

    inputs.property('minecraftArtifact', artifactSelection.getOrElse(''))
    inputs.property('minecraftCandidateArtifact', candidateSelection.getOrElse(''))
    inputs.property('fabricMinecraftPredicate', minecraftPredicate)
    inputs.properties(expandProps)
}

tasks.withType(org.gradle.api.publish.maven.tasks.AbstractPublishToMaven).configureEach {
    doFirst {
        if (candidateSelection.isPresent()) {
            throw new GradleException('Candidate interval artifacts are validation-only and cannot publish')
        }
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId base.archivesName.get()
            from components.java
        }
    }
    repositories {
        maven {
            url System.getenv('local_maven_url')
        }
    }
}
