import org.gradle.api.tasks.PathSensitivity

plugins {
    id 'multiloader-common'
}

// Common owns one selected source family; do not resolve unsupported directory artifacts.
evaluationDependsOn(':common')
def commonProject = project(':common')
def commonSources = commonProject.sourceSets.main

def nativeFamily = rootProject.ext.minecraftNativeFamily
def selectedTarget = rootProject.ext.minecraftTarget
def families = rootProject.ext.minecraftNativeSourceFamilies
// Forge reuses the selected FML integration; feature sources are never copied.
def loaderSourceRoot = project.name == 'forge' ? rootProject.file('neoforge') : projectDir
def javaRoots = [new File(loaderSourceRoot, 'src/main/java')] + families.collect { new File(loaderSourceRoot, "src/targets/${it}/java") }
def resourceRoots = [new File(loaderSourceRoot, 'src/main/resources')] + families.collect { new File(loaderSourceRoot, "src/targets/${it}/resources") }
if (!families.contains(selectedTarget)) {
    javaRoots.add(new File(loaderSourceRoot, "src/targets/${selectedTarget}/java"))
    resourceRoots.add(new File(loaderSourceRoot, "src/targets/${selectedTarget}/resources"))
}
if (loaderSourceRoot != projectDir) {
    // Exact Forge API leaves follow the same oldest-last override order as common.
    families.each { family ->
        javaRoots.add(file("src/targets/${family}/java"))
        resourceRoots.add(file("src/targets/${family}/resources"))
    }
    if (!families.contains(selectedTarget)) {
        javaRoots.add(file("src/targets/${selectedTarget}/java"))
        resourceRoots.add(file("src/targets/${selectedTarget}/resources"))
    }
}
def overridden = { element, List<File> roots ->
    if (element.directory) return false
    def index = roots.findIndexOf { element.file.toPath().startsWith(it.toPath()) }
    index >= 0 && roots.drop(index + 1).any { new File(it, element.relativePath.pathString).isFile() }
}
sourceSets.main.java {
    setSrcDirs(javaRoots)
    exclude { element -> overridden(element, javaRoots) }
}
sourceSets.main.resources {
    setSrcDirs(resourceRoots)
    exclude { element -> overridden(element, resourceRoots) }
}


// Share the same configured binding rule; common sources are already selected once.
commonProject.validateSelectedMinecraftJava([sourceSets.main.allJava, commonSources.allJava])
commonProject.validateSelectedMinecraftResources([sourceSets.main.resources, commonSources.resources])
def loaderMixinSelection = commonProject.selectConfiguredMinecraftMixins(
        sourceSets.main.java, [sourceSets.main.resources, commonSources.resources],
        commonProject.minecraftMixinSelection)

dependencies {
    testImplementation('com.google.code.gson:gson:2.8.9')
    testImplementation('org.junit.jupiter:junit-jupiter:5.11.4')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher:1.11.4')
    compileOnly(project(':common')) {
        def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
        attributes {
            attribute(loaderAttribute, 'common')
        }
    }
}

tasks.withType(Test).configureEach { useJUnitPlatform() }

def validateSelection = tasks.register('validateMinecraftTargetSources') {
    group = 'verification'
    description = 'Reject collisions between loader sources and selected common sources.'
    dependsOn(commonProject.tasks.named('validateMinecraftTargetSources'))
    inputs.property('minecraftTarget', rootProject.ext.minecraftTarget)
    inputs.files(sourceSets.main.allJava, commonSources.allJava, loaderMixinSelection.rawJava)
            .withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.files(sourceSets.main.resources, commonSources.resources).withPathSensitivity(PathSensitivity.RELATIVE)
    outputs.upToDateWhen { false }
    doLast {
        commonProject.validateSelectedMinecraftJava([sourceSets.main.allJava, commonSources.allJava])
        commonProject.validateSelectedMinecraftResources([sourceSets.main.resources, commonSources.resources])
    }
}

tasks.named('compileJava', JavaCompile) {
    dependsOn(validateSelection)
    source(commonSources.allJava)
    inputs.property('minecraftTarget', rootProject.ext.minecraftTarget)
}

processResources {
    dependsOn(validateSelection)
    // Raw selected resources still pass through this loader's expansion/copy lifecycle.
    // Root distribution.gradle adds stageBundledExtensions to this same task.
    from(commonSources.resources)
    inputs.property('minecraftTarget', rootProject.ext.minecraftTarget)
    duplicatesStrategy = DuplicatesStrategy.FAIL
}

tasks.named('javadoc', Javadoc).configure {
    dependsOn(validateSelection)
    source(commonSources.allJava)
    inputs.property('minecraftTarget', rootProject.ext.minecraftTarget)
}

tasks.named('sourcesJar', Jar) {
    dependsOn(validateSelection)
    from(commonSources.allJava)
    from(commonSources.resources)
    inputs.property('minecraftTarget', rootProject.ext.minecraftTarget)
    duplicatesStrategy = DuplicatesStrategy.FAIL
}
