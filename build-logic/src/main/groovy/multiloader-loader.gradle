import org.gradle.api.tasks.PathSensitivity

plugins {
    id 'multiloader-common'
}

// Common owns one selected source family; do not resolve unsupported directory artifacts.
evaluationDependsOn(':common')
def commonProject = project(':common')
def commonSources = commonProject.sourceSets.main

dependencies {
    testImplementation('com.google.code.gson:gson:2.14.0')
    testImplementation('org.junit.jupiter:junit-jupiter:5.11.4')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher:1.11.4')
    compileOnly(project(':common')) {
        def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
        attributes {
            attribute(loaderAttribute, 'common')
        }
    }
}

tasks.withType(Test).configureEach { useJUnitPlatform() }

def validateSelection = tasks.register('validateMinecraftTargetSources') {
    group = 'verification'
    description = 'Reject collisions between loader sources and selected common sources.'
    dependsOn(commonProject.tasks.named('validateMinecraftTargetSources'))
    inputs.property('minecraftTarget', rootProject.ext.minecraftTarget)
    inputs.files(sourceSets.main.allJava, commonSources.allJava).withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.files(sourceSets.main.resources, commonSources.resources).withPathSensitivity(PathSensitivity.RELATIVE)
    outputs.upToDateWhen { false }
    doLast {
        commonProject.validateSelectedMinecraftJava([sourceSets.main.allJava, commonSources.allJava])
        commonProject.validateSelectedMinecraftResources([sourceSets.main.resources, commonSources.resources])
    }
}

tasks.named('compileJava', JavaCompile) {
    dependsOn(validateSelection)
    source(commonSources.allJava)
    inputs.property('minecraftTarget', rootProject.ext.minecraftTarget)
}

processResources {
    dependsOn(validateSelection)
    // Raw selected resources still pass through this loader's expansion/copy lifecycle.
    // Root distribution.gradle adds stageBundledExtensions to this same task.
    from(commonSources.resources)
    inputs.property('minecraftTarget', rootProject.ext.minecraftTarget)
    duplicatesStrategy = DuplicatesStrategy.FAIL
}

tasks.named('javadoc', Javadoc).configure {
    dependsOn(validateSelection)
    source(commonSources.allJava)
    inputs.property('minecraftTarget', rootProject.ext.minecraftTarget)
}

tasks.named('sourcesJar', Jar) {
    dependsOn(validateSelection)
    from(commonSources.allJava)
    from(commonSources.resources)
    inputs.property('minecraftTarget', rootProject.ext.minecraftTarget)
    duplicatesStrategy = DuplicatesStrategy.FAIL
}
